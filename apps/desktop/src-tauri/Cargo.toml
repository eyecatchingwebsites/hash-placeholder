[package]
name = "hashcoin-miner"
version = "0.1.0"
edition = "2021"
description = "Hashcoin Miner desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hashcoin-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[features]
# Lets a debug build trust the local dev API's throwaway key via HASHCOIN_DEV_PUBKEY.
dev-key = []

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_SystemInformation"] }
