<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hashcoin promo</title>
<!--
  The Hashcoin promo film (v4). One world, one camera: every part of the system sits on a single
  loop, and the camera flies from step to step, then pulls back to show the whole loop at once.
  The coin in the opening is the same $HASH node the story returns to. One short line per step.
  Every frame is a pure function of time: seek(t) sets the whole stage for t seconds, so
  render.mjs can step through it (with sub-frames for motion blur). Open this file in a browser to
  watch it loop, or add ?t=12.5 to freeze on a moment.
  Third-party marks, used unaltered: Pearl, Quantus and QubitCoin marks (supplied by the user),
  the Solana logomark (solana.com/branding).
-->
<style>
  @font-face { font-family: "Inter"; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; }
  :root { --white: #F5F5F7; --gray: #8E8E93; --fine: #6E6E73; --gold: #EBB447; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--white); background: #060607;
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transform-origin: 0 0; }
  canvas, #world, #caps, #vignette { position: absolute; left: 0; top: 0; }
  #world { width: 0; height: 0; transform-origin: 0 0; }
  #vignette { width: 1920px; height: 1080px; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 55%, transparent 55%, rgba(0,0,0,.6) 100%); }
  /* Nodes live in world space */
  .node { position: absolute; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, #1C1C20 0%, #111113 60%, #0C0C0E 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.6); }
  .node .ring { position: absolute; inset: -14px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 60px rgba(235,180,71,.35), inset 0 0 30px rgba(235,180,71,.12); opacity: 0; }
  .node .icon { width: 50%; height: 50%; object-fit: contain; }
  .node svg.icon { fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .node img.full { width: 100%; height: 100%; }
  .node .badge { position: absolute; right: -4%; bottom: -4%; width: 34%; height: 34%; border-radius: 50%; background: #0C0C0E; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14); display: grid; place-items: center; }
  .node .badge img { width: 52%; }
  .nl { position: absolute; left: 50%; top: calc(100% + 26px); transform: translateX(-50%); white-space: nowrap; font-size: 34px; font-weight: 600; letter-spacing: -.015em; color: #C7C7CC; }
  /* Captions live in screen space */
  #caps { width: 1920px; height: 1080px; }
  .cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 640; letter-spacing: -.035em; line-height: 1.1; color: var(--white); }
  .cap .w { display: inline-block; white-space: pre; }
  .cap.sub { color: var(--gray); font-weight: 520; letter-spacing: -.015em; }
  .sol-mark { display: inline-block; height: .7em; width: auto; vertical-align: -.03em; margin-right: .2em; }
  #endcoin { position: absolute; left: 50%; top: 250px; width: 200px; height: 200px; margin-left: -100px; }
  #endglow { position: absolute; left: 50%; top: 350px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(235,180,71,.22), rgba(235,180,71,.06) 50%, transparent 75%); }
  #endword { position: absolute; left: 0; right: 0; top: 490px; text-align: center; font-size: 200px; font-weight: 720; letter-spacing: -.055em; line-height: 1; }
  #fine { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-size: 26px; color: var(--fine); font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="world"></div>
  <div id="vignette"></div>
  <div id="caps">
    <div id="endglow"></div>
    <img id="endcoin" src="assets/coin.svg" alt="">
    <div id="endword">$HASH</div>
    <div id="fine">Not financial advice. Never share your seed phrase. Not affiliated with Pearl, Quantus, QubitCoin or the Solana Foundation.</div>
  </div>
</div>

<script>
"use strict";
const DURATION = 53;
const W = 1920, H = 1080, FX = 960, FY0 = 600; // the camera's focus point on screen
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  io5: (x) => (x < 0.5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(-2 * x + 2, 5) / 2),
  expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  // A soft settle with a touch of overshoot, for things arriving.
  back: (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
};

// ---------- Tracks: [time, props, ease]; props carry forward ----------
function track(keys, def = { o: 0, x: 0, y: 0, s: 1, b: 0, g: 0 }) {
  let cur = { ...def };
  return keys.map(([t, p, e]) => { cur = { ...cur, ...p }; return [t, { ...cur }, e || "io"]; });
}
function sample(tr, t) {
  if (t <= tr[0][0]) return tr[0][1];
  for (let i = 1; i < tr.length; i++) {
    const [t1, p1, e] = tr[i];
    if (t <= t1) {
      const [t0, p0] = tr[i - 1];
      const k = E[e](clamp((t - t0) / (t1 - t0)));
      const r = {};
      for (const key in p1) r[key] = p0[key] + (p1[key] - p0[key]) * k;
      return r;
    }
  }
  return tr[tr.length - 1][1];
}
function apply(el, p, base = "") {
  el.style.opacity = p.o.toFixed(4);
  el.style.visibility = p.o < 0.002 ? "hidden" : "visible";
  el.style.transform = `${base}translate(${p.x}px, ${p.y}px) scale(${p.s})`;
  el.style.filter = p.b > 0.05 ? `blur(${p.b.toFixed(2)}px)` : "none";
}

// ---------- The world: one loop ----------
const R = 1000;
const rad = (d) => (d * Math.PI) / 180;
const P = (deg, r = R) => [Math.cos(rad(deg)) * r, Math.sin(rad(deg)) * r];
const ANG = { A: 180, B: 235, C: 305, D: 360, E: 415, F: 485 };

const ICON = {
  gpu: '<svg class="icon" viewBox="0 0 48 48"><rect x="4" y="13" width="40" height="21" rx="3"/><circle cx="17" cy="23.5" r="5.5"/><circle cx="31" cy="23.5" r="5.5"/><path d="M9 34v5M15 34v3M21 34v3M27 34v3"/></svg>',
  chart: '<svg class="icon" viewBox="0 0 48 48"><path d="M9 14v20"/><rect x="6" y="18" width="6" height="12" rx="1"/><path d="M21 10v26"/><rect x="18" y="14" width="6" height="16" rx="1"/><path d="M33 8v22"/><rect x="30" y="11" width="6" height="13" rx="1"/></svg>',
  pot: '<svg class="icon" viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="30" rx="4"/><circle cx="24" cy="24" r="8"/><path d="M24 16v3M24 29v3M16 24h3M29 24h3M12 39v3M36 39v3"/></svg>',
  people: '<svg class="icon" viewBox="0 0 48 48"><circle cx="18" cy="17" r="6"/><path d="M7 38c1-7 6-11 11-11s10 4 11 11"/><circle cx="33" cy="19" r="5"/><path d="M30 28c5 0 10 3 11 9"/></svg>',
};

const world = $("world");
const NODES = {}; // id -> { el, x, y, r, tr, ring }
function addNode(id, x, y, r, inner, label, tr) {
  const el = document.createElement("div");
  el.className = "node";
  el.style.cssText = `left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;`;
  el.innerHTML = `<div class="ring"></div>${inner}${label ? `<div class="nl">${label}</div>` : ""}`;
  world.appendChild(el);
  NODES[id] = { el, x, y, r, tr, ring: el.firstElementChild };
}
// Arrive: grow from 60% with a soft settle, sharpening from a blur.
const arrive = (a, extra = []) => track([[a, { o: 0, s: 0.6, b: 10 }], [a + 1.0, { o: 1, s: 1, b: 0 }, "back"], ...extra]);

const [Ax, Ay] = P(ANG.A), [Bx, By] = P(ANG.B), [Cx, Cy] = P(ANG.C), [Dx, Dy] = P(ANG.D), [Ex, Ey] = P(ANG.E), [Fx, Fy] = P(ANG.F);
const [Qx, Qy] = [Bx - 250, By - 250], [Ux, Uy] = [Bx + 250, By - 250]; // the other two coins sit above Pearl

// Times (seconds)
const T = {
  pour: 5.7, coin: 6.4, toA: [8.2, 10.6], A: 10.6, toB: [14.0, 15.8], B: 15.8, pick: [16.4, 17.0, 17.6],
  toC: [20.0, 21.8], C: 21.8, toD: [25.6, 27.2], D: 27.2, toE: [30.8, 32.4], E: 32.4, toF: [36.0, 37.8], F: 37.8,
  back: [41.6, 44.4], out: [47.0, 48.2], end: 48.2,
};
const WORLD_OUT = [[T.out[0], {}], [T.out[1], { o: 0 }, "in"]];

addNode("C", Cx, Cy, 120, '<img class="full" src="assets/coin.svg" alt=""><div class="badge" id="solbadge"><img src="assets/solana.svg" alt=""></div>', "$HASH", arrive(T.coin, WORLD_OUT));
addNode("A", Ax, Ay, 120, ICON.gpu, "Your GPU", arrive(T.toA[1] - 0.9, WORLD_OUT));
addNode("Q", Qx, Qy, 76, '<img class="icon" src="assets/quantus.png" alt="">', "Quantus",
  arrive(T.toB[1] - 0.9, [[T.pick[0], {}], [T.pick[0] + 0.25, { g: 1 }], [T.pick[1], {}], [T.pick[1] + 0.25, { g: 0 }], [18.2, {}], [18.9, { o: 0.32 }], ...WORLD_OUT]));
addNode("PRL", Bx, By, 84, '<img class="icon" src="assets/pearl-mark.png" alt="" style="width:52%">', "Pearl",
  arrive(T.toB[1] - 0.75, [[T.pick[2], {}], [T.pick[2] + 0.3, { g: 1, s: 1.06 }, "out"], [T.pick[2] + 0.9, { s: 1 }], ...WORLD_OUT]));
addNode("U", Ux, Uy, 76, '<img class="icon" src="assets/qubitcoin.png" alt="">', "QubitCoin",
  arrive(T.toB[1] - 0.6, [[T.pick[1], {}], [T.pick[1] + 0.25, { g: 1 }], [T.pick[2], {}], [T.pick[2] + 0.25, { g: 0 }], [18.2, {}], [18.9, { o: 0.32 }], ...WORLD_OUT]));
addNode("D", Dx, Dy, 110, ICON.chart, "Traders", arrive(T.toD[1] - 0.8, WORLD_OUT));
addNode("E", Ex, Ey, 110, ICON.pot, "2–5% tax", arrive(T.toE[1] - 0.8, [[T.E + 1.0, {}], [T.E + 1.6, { g: 1 }], ...WORLD_OUT]));
addNode("F", Fx, Fy, 110, ICON.people, "Holders and miners", arrive(T.toF[1] - 0.9, WORLD_OUT));
const solbadge = $("solbadge");
const BADGE = track([[T.toC[1] - 0.4, { o: 0, s: 0.4 }], [T.toC[1] + 0.5, { o: 1, s: 1 }, "back"]]);

// ---------- Camera: angle on the loop, distance from the centre, zoom ----------
const CAM_TH = track([
  [0, { v: ANG.C }], [T.toA[0], {}], [T.toA[1], { v: ANG.A }, "io5"],
  [T.toB[0], {}], [T.toB[1], { v: ANG.B }, "io5"], [T.toC[0], {}], [T.toC[1], { v: ANG.C }, "io5"],
  [T.toD[0], {}], [T.toD[1], { v: ANG.D }, "io5"], [T.toE[0], {}], [T.toE[1], { v: ANG.E }, "io5"],
  [T.toF[0], {}], [T.toF[1], { v: 450 }, "io5"],
], { v: 0 });
const CAM_R = track([[0, { v: R }], [T.toF[0], {}], [T.toF[1], { v: R * 0.72 }, "io5"], [T.back[0], {}], [T.back[1], { v: 0 }, "io5"]], { v: 0 });
// Zoom dips during each move (a small fly-over) and creeps in while holding.
const CAM_Z = track([
  [0, { v: 1 }], [T.toA[0], { v: 1.03 }, "lin"], [9.4, { v: 0.5 }, "io"], [T.toA[1], { v: 1 }, "io"],
  [T.toB[0], { v: 1.04 }, "lin"], [14.9, { v: 0.78 }, "io"], [T.toB[1], { v: 0.92 }, "io"],
  [T.toC[0], { v: 0.96 }, "lin"], [20.9, { v: 0.78 }, "io"], [T.toC[1], { v: 1 }, "io"],
  [T.toD[0], { v: 1.04 }, "lin"], [26.4, { v: 0.82 }, "io"], [T.toD[1], { v: 1 }, "io"],
  [T.toE[0], { v: 1.04 }, "lin"], [31.6, { v: 0.82 }, "io"], [T.toE[1], { v: 1 }, "io"],
  [T.toF[0], { v: 1.04 }, "lin"], [T.toF[1], { v: 0.76 }, "io5"],
  [T.back[0], { v: 0.79 }, "lin"], [T.back[1], { v: 0.355 }, "io5"], [T.out[0], { v: 0.375 }, "lin"], [T.out[1], { v: 0.28 }, "io"],
], { v: 1 });
function camera(t) {
  const th = rad(sample(CAM_TH, t).v), r = sample(CAM_R, t).v, z = sample(CAM_Z, t).v;
  const cx = Math.cos(th) * r, cy = Math.sin(th) * r;
  const fy = FY0 + 28 * E.io5(clamp((t - T.back[0]) / (T.back[1] - T.back[0])));
  return { z, tx: FX - cx * z, ty: fy - cy * z };
}

// ---------- Captions, word by word (screen space) ----------
const CAPS = [];
const SOL_IMG = '<img class="sol-mark" src="assets/solana.svg" alt="">';
function caption(text, top, size, t0, t1, sub = false) {
  const el = document.createElement("div");
  el.className = "cap" + (sub ? " sub" : "");
  el.style.top = top + "px"; el.style.fontSize = size + "px";
  el.innerHTML = text.split(" ").map((w) => `<span class="w">${w}</span>`).join(" ").replaceAll("{SOL}", SOL_IMG);
  $("caps").appendChild(el);
  [...el.querySelectorAll(".w")].forEach((w, i) => CAPS.push([w, track([
    [t0 + i * 0.07, { o: 0, y: 16, b: 10 }], [t0 + i * 0.07 + 1.0, { o: 1, y: 0, b: 0 }, "expo"],
    [t1, {}], [t1 + 0.6, { o: 0, y: -8, b: 8 }, "in"],
  ])]));
}
caption("Most coins need buyers.", 488, 104, 0.6, 3.2);
caption("$HASH makes its own.", 488, 104, 3.7, 5.6);
caption("Your GPU mines in the background.", 112, 74, T.A, T.toB[0] - 0.3);
caption("It picks the coin that pays most.", 112, 74, T.B + 0.1, T.toC[0] - 0.3);
caption("Then it buys $HASH on {SOL}Solana.", 112, 74, T.C + 0.1, T.toD[0] - 0.3);
caption("People buy and sell $HASH.", 112, 74, T.D + 0.1, T.toE[0] - 0.3);
caption("Every trade pays a 2–5% tax.", 112, 74, T.E + 0.1, T.toF[0] - 0.3);
caption("The tax pays holders and miners.", 112, 74, T.F + 0.1, T.back[0] - 0.2);
caption("One loop. Around the clock.", 112, 74, T.back[1] - 0.9, T.out[0] - 0.2);
caption("On {SOL}Solana. Coming soon.", 726, 56, T.end + 1.2, 99, true);
const SCREEN = [
  [$("endcoin"), track([[T.end, { o: 0, s: 0.7, b: 14 }], [T.end + 1.2, { o: 1, s: 1, b: 0 }, "back"]])],
  [$("endglow"), track([[T.end + 0.1, { o: 0, s: 0.7 }], [T.end + 1.8, { o: 1, s: 1 }, "out"]])],
  [$("endword"), track([[T.end + 0.5, { o: 0, y: 30, b: 18 }], [T.end + 1.6, { o: 1, y: 0, b: 0 }, "expo"]])],
  [$("fine"), track([[T.end + 2.2, { o: 0 }], [T.end + 3.0, { o: 1 }]])],
];

// ================= Canvas =================
const cv = $("fx"), g = cv.getContext("2d");
const GOLD = [235, 180, 71], WHITE = [242, 242, 246], GRAY = [74, 74, 80], GREEN = [52, 199, 123], RED = [255, 90, 95];
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
let seed = 9;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function disc(x, y, r, c, a) { if (a <= 0.005) return; g.fillStyle = rgba(c, a); g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); }
function glow(x, y, r, c, a) {
  if (a <= 0.005) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}

// The opening field: every dot is a PC. A wave lights them gold, then they pour into the coin.
const HOOK = [];
{
  const sp = 30, cols = Math.floor(W / sp) + 1, rows = Math.floor(H / sp) + 1;
  const ox = (W - (cols - 1) * sp) / 2, oy = (H - (rows - 1) * sp) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = ox + c * sp, y = oy + r * sp;
    HOOK.push({ x, y, d: Math.hypot((x - FX) / 960, (y - FY0) / 600) / Math.SQRT2, j: rnd() });
  }
}
function drawHook(t) {
  if (t > T.coin + 1.2) return;
  for (const p of HOOK) {
    const appear = E.out(clamp((t - 0.2) / 1.2));
    const lit = E.out(clamp((t - (3.9 + p.d * 1.6 + p.j * 0.3)) / 0.6));
    const pour = E.in(clamp((t - (T.pour + (1 - p.d) * 0.5 + p.j * 0.25)) / 1.0));
    const x = lerp(p.x, FX, pour), y = lerp(p.y, FY0, pour);
    const a = appear * (0.22 + 0.78 * lit) * (1 - clamp((pour - 0.85) / 0.15));
    if (a <= 0.01) continue;
    const c = mixc(GRAY, GOLD, lit), r = 2.3 * (1 - 0.35 * pour);
    if (lit > 0.3) disc(x, y, r * 2.6, c, a * 0.13);
    disc(x, y, r, c, a);
  }
}

// World texture: a faint grid of dots that moves with the camera.
function drawWorldDots(t, cam, fade) {
  const a = 0.19 * E.out(clamp((t - (T.coin + 0.4)) / 1.5)) * fade;
  if (a <= 0.005) return;
  const sp = 70;
  const x0 = (0 - cam.tx) / cam.z, x1 = (W - cam.tx) / cam.z, y0 = (0 - cam.ty) / cam.z, y1 = (H - cam.ty) / cam.z;
  g.fillStyle = rgba(GRAY, a);
  const r = 1.6 / Math.max(cam.z, 0.5);
  for (let x = Math.floor(x0 / sp) * sp; x <= x1; x += sp) for (let y = Math.floor(y0 / sp) * sp; y <= y1; y += sp) {
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
}

// Links along the loop. Each draws itself on, then carries comets.
const LINKS = [
  { a0: ANG.A, r0: 120, a1: ANG.B, r1: 84, draw: [T.toB[0] + 0.2, T.toB[1] - 0.1], from: T.B - 0.2, n: 3, c: WHITE },
  { a0: ANG.B, r0: 84, a1: ANG.C, r1: 120, draw: [T.toC[0] + 0.2, T.toC[1] - 0.1], from: T.C - 0.2, n: 3, c: GOLD },
  { a0: ANG.C, r0: 120, a1: ANG.D, r1: 110, draw: [T.toD[0] + 0.2, T.toD[1] - 0.1], from: T.D - 0.2, n: 3, c: GOLD },
  { a0: ANG.D, r0: 110, a1: ANG.E, r1: 110, draw: [T.toE[0] + 0.2, T.toE[1] - 0.1], from: T.E - 0.2, n: 4, c: GOLD, small: true },
  { a0: ANG.E, r0: 110, a1: ANG.F, r1: 110, draw: [T.toF[0] + 0.2, T.toF[1] - 0.2], from: T.F - 0.3, n: 3, c: GOLD },
  { a0: ANG.F, r0: 110, a1: ANG.A + 360, r1: 120, draw: [T.toF[0] + 0.7, T.toF[1] + 0.3], from: T.F, n: 3, c: GOLD },
];
const SPEED = 430; // comet speed, world px per second
function drawLinks(t, fade) {
  for (const L of LINKS) {
    const s = rad(L.a0) + (L.r0 + 26) / R, e = rad(L.a1) - (L.r1 + 26) / R;
    const p = E.io(clamp((t - L.draw[0]) / (L.draw[1] - L.draw[0])));
    if (p <= 0) continue;
    g.strokeStyle = rgba(WHITE, 0.13 * fade); g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, R, s, lerp(s, e, p)); g.stroke();
    if (t < L.from) continue;
    const on = E.out(clamp((t - L.from) / 0.8)) * fade;
    const len = (e - s) * R, tail = (L.small ? 110 : 180) / R, head = L.small ? 5 : 7;
    for (let k = 0; k < L.n; k++) {
      const u = (((t - L.from) * SPEED) / len + k / L.n) % 1;
      const ang = s + (e - s) * u;
      const edge = clamp(Math.min(u, 1 - u) * 10);
      // Tail: fading dots behind the head.
      for (let i = 14; i >= 1; i--) {
        const ta = ang - (tail * i) / 14;
        if (ta < s) continue;
        disc(Math.cos(ta) * R, Math.sin(ta) * R, head * (1 - i / 16), L.c, on * edge * 0.75 * (1 - i / 14));
      }
      const hx = Math.cos(ang) * R, hy = Math.sin(ang) * R;
      glow(hx, hy, head * 6, L.c, on * edge * 0.35);
      disc(hx, hy, head, mixc(L.c, WHITE, 0.4), on * edge);
    }
  }
}
// The GPU at work: soft rings breathing out of it.
function drawGpuRings(t, fade) {
  if (t < T.A - 0.4) return;
  for (let k = 0; k < 3; k++) {
    const ph = (((t - (T.A - 0.4)) / 2.1 + k / 3) % 1);
    g.strokeStyle = rgba(WHITE, (1 - ph) * 0.16 * fade); g.lineWidth = 2;
    g.beginPath(); g.arc(Ax, Ay, 140 + ph * 120, 0, 6.2832); g.stroke();
  }
}
// The coin takes a beat each time a buy lands.
function coinPulse(t) {
  if (t < T.C) return 0;
  const len = (rad(ANG.C) - rad(ANG.B)) * R, per = len / SPEED / 3;
  const ph = ((t - (T.C - 0.2)) % per) / per;
  return Math.exp(-ph * 9) * clamp((t - T.C) / 0.5);
}
// Trades: BUY and SELL tags rising beside the market.
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawTrades(t, fade) {
  const t0 = T.D - 0.6;
  if (t < t0) return;
  g.font = "700 26px Inter"; g.textAlign = "center"; g.textBaseline = "middle";
  for (let k = 0; k < 80; k++) {
    const born = t0 + k * 0.62, life = 2.2, u = (t - born) / life;
    if (u < 0 || u > 1) continue;
    const buy = [0, 1, 0, 0, 1, 0, 1, 0][k % 8] === 0;
    const c = buy ? GREEN : RED;
    const x = Dx + 235 + ((k * 53) % 3 - 1) * 46, y = Dy + 60 - E.out(u) * 230;
    const a = clamp(u / 0.15) * clamp((1 - u) / 0.3) * fade;
    g.fillStyle = rgba(c, 0.16 * a); roundRect(x - 62, y - 24, 124, 48, 24); g.fill();
    g.fillStyle = rgba(c, a); g.fillText(buy ? "BUY" : "SELL", x, y + 1);
  }
}

// ================= seek =================
const WORLD = track([[0, { o: 1 }], ...WORLD_OUT]);
function seek(t) {
  const cam = camera(t);
  world.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.z})`;
  const fade = sample(WORLD, t).o;
  for (const id in NODES) {
    const n = NODES[id], p = sample(n.tr, t);
    if (id === "C") p.s *= 1 + 0.035 * coinPulse(t);
    apply(n.el, p);
    n.ring.style.opacity = p.g.toFixed(3);
  }
  apply(solbadge, sample(BADGE, t));
  for (const [el, tr] of CAPS) apply(el, sample(tr, t));
  for (const [el, tr] of SCREEN) apply(el, sample(tr, t));

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  drawHook(t);
  g.setTransform(cam.z, 0, 0, cam.z, cam.tx, cam.ty);
  drawWorldDots(t, cam, fade);
  drawGpuRings(t, fade);
  drawLinks(t, fade);
  drawTrades(t, fade);
  g.setTransform(1, 0, 0, 1, 0, 0);
}
window.seek = seek;
window.DURATION = DURATION;

if (!navigator.webdriver) {
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = `scale(${k})`; };
  fit(); addEventListener("resize", fit);
  document.fonts.load("700 100px Inter").then(() => {
    const fixed = new URLSearchParams(location.search).get("t");
    if (fixed !== null) seek(Number(fixed));
    else { const t0 = performance.now(); const loop = (n) => { seek(((n - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  });
}
</script>
