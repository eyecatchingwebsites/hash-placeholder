<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hashcoin promo</title>
<!--
  The Hashcoin promo film (v5).
  - Opening: a field of dots (every dot a PC) pours into the $HASH coin.
  - The loop: every step sits on one loop; the camera pans straight from step to step.
  - Inside the tax: slides for the self-adjusting tax, the split, miner bonus, holder rewards, levels.
  - Back out: the camera pulls back to the whole loop, then the end card.
  Every frame is a pure function of time: seek(t) sets the whole stage for t seconds, so
  render.mjs can step through it (with sub-frames for motion blur). Open this file in a browser to
  watch it loop, or add ?t=12.5 to freeze on a moment.
  Third-party marks, used unaltered: Pearl, Quantus and QubitCoin marks (supplied by the user),
  the Solana logomark (solana.com/branding).
-->
<style>
  @font-face { font-family: "Inter"; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; }
  :root { --white: #F5F5F7; --gray: #8E8E93; --fine: #6E6E73; --gold: #EBB447; --gold-2: #F6DFA6; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--white); background: #060607;
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transform-origin: 0 0; }
  #fx, #world, #slides, #caps, #vignette { position: absolute; left: 0; top: 0; }
  #world { width: 0; height: 0; transform-origin: 0 0; }
  #slides, #caps, #vignette { width: 1920px; height: 1080px; }
  #vignette { pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 55%, transparent 55%, rgba(0,0,0,.6) 100%); }
  .abs { position: absolute; }
  /* Nodes (world space) */
  .node { position: absolute; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #1E1E23 0%, #121215 60%, #0C0C0E 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.6); }
  .node .ring { position: absolute; inset: -14px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 60px rgba(235,180,71,.35), inset 0 0 30px rgba(235,180,71,.12); opacity: 0; }
  .node .icon { width: 50%; height: 50%; object-fit: contain; }
  .node .art { width: 74%; height: auto; }
  .node img.full { width: 100%; height: 100%; }
  .node .badge { position: absolute; right: -4%; bottom: -4%; width: 34%; height: 34%; border-radius: 50%; background: #0C0C0E; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14); display: grid; place-items: center; }
  .node .badge img { width: 52%; }
  .nl { position: absolute; left: 50%; top: calc(100% + 26px); transform: translateX(-50%); white-space: nowrap; font-size: 34px; font-weight: 600; letter-spacing: -.015em; color: #C7C7CC; }
  /* Slides (screen space) */
  .slide { position: absolute; inset: 0; }
  #fx2, #fx3 { position: absolute; left: 0; top: 0; }
  .big-num { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .t-lab { position: absolute; font-size: 34px; font-weight: 600; color: var(--gray); letter-spacing: -.01em; white-space: nowrap; }
  .t-lab b { color: var(--white); font-weight: 650; }
  .seg-lab { position: absolute; text-align: center; transform: translateX(-50%); white-space: nowrap; }
  .seg-lab b { display: block; font-size: 40px; font-weight: 650; letter-spacing: -.02em; }
  .seg-lab span { display: block; font-size: 30px; color: var(--gray); font-weight: 550; margin-top: 4px; }
  .card { position: absolute; top: 330px; width: 330px; height: 470px; margin-left: -165px; border-radius: 28px; background: linear-gradient(180deg, #17171B, #0E0E10); box-shadow: inset 0 0 0 2px rgba(255,255,255,.09), 0 30px 80px rgba(0,0,0,.6); text-align: center; }
  .card .lvl { margin-top: 34px; font-size: 34px; font-weight: 600; color: #C7C7CC; }
  .card .mx { font-size: 104px; font-weight: 720; letter-spacing: -.05em; color: var(--gold); line-height: 1.05; }
  .card.top { box-shadow: inset 0 0 0 2px rgba(235,180,71,.5), 0 0 80px rgba(235,180,71,.18), 0 30px 80px rgba(0,0,0,.6); }
  /* Captions (screen space) */
  .cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 640; letter-spacing: -.035em; line-height: 1.1; color: var(--white); }
  .cap .w { display: inline-block; white-space: pre; }
  .cap.sub { color: var(--gray); font-weight: 520; letter-spacing: -.015em; }
  .sol-mark { display: inline-block; height: .7em; width: auto; vertical-align: -.03em; margin-right: .2em; }
  #endcoin { position: absolute; left: 50%; top: 250px; width: 200px; height: 200px; margin-left: -100px; }
  #endglow { position: absolute; left: 50%; top: 350px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(235,180,71,.22), rgba(235,180,71,.06) 50%, transparent 75%); }
  #endword { position: absolute; left: 0; right: 0; top: 490px; text-align: center; font-size: 200px; font-weight: 720; letter-spacing: -.055em; line-height: 1; }
  #fine { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-size: 26px; color: var(--fine); font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="world"></div>
  <div id="slides"><canvas id="fx2" width="1920" height="1080"></canvas></div>
  <div id="vignette"></div>
  <div id="caps">
    <div id="endglow"></div>
    <img id="endcoin" src="assets/coin.svg" alt="">
    <div id="endword">$HASH</div>
    <div id="fine">Not financial advice. Never share your seed phrase. Not affiliated with Pearl, Quantus, QubitCoin or the Solana Foundation.</div>
  </div>
</div>

<script>
"use strict";
const DURATION = 84;
const W = 1920, H = 1080, FX = 960, FY = 600; // the camera's focus point on screen
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  // Camera moves: a smooth, symmetric ease with no snap at either end.
  sine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  back: (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
};

// ---------- Tracks: [time, props, ease]; props carry forward ----------
function track(keys, def = { o: 0, x: 0, y: 0, s: 1, b: 0, g: 0 }) {
  let cur = { ...def };
  return keys.map(([t, p, e]) => { cur = { ...cur, ...p }; return [t, { ...cur }, e || "io"]; });
}
function sample(tr, t) {
  if (t <= tr[0][0]) return tr[0][1];
  for (let i = 1; i < tr.length; i++) {
    const [t1, p1, e] = tr[i];
    if (t <= t1) {
      const [t0, p0] = tr[i - 1];
      const k = E[e](clamp((t - t0) / (t1 - t0)));
      const r = {};
      for (const key in p1) r[key] = p0[key] + (p1[key] - p0[key]) * k;
      return r;
    }
  }
  return tr[tr.length - 1][1];
}
function apply(el, p, base = "") {
  el.style.opacity = p.o.toFixed(4);
  el.style.visibility = p.o < 0.002 ? "hidden" : "visible";
  el.style.transform = `${base}translate(${p.x}px, ${p.y}px) scale(${p.s})`;
  el.style.filter = p.b > 0.05 ? `blur(${p.b.toFixed(2)}px)` : "none";
}

// ---------- Illustrations ----------
function gpuSvg(id) {
  let fins = "", pins = "", fans = "";
  for (let x = 26; x <= 222; x += 5) fins += `<line x1="${x}" y1="90" x2="${x}" y2="99"/>`;
  for (let x = 48; x <= 150; x += 4.2) pins += `<rect x="${x.toFixed(1)}" y="110" width="2.6" height="9" rx=".6"/>`;
  [66, 123, 180].forEach((cx) => {
    let blades = "";
    for (let i = 0; i < 9; i++) blades += `<g transform="rotate(${i * 40})"><ellipse cx="9" cy="-14" rx="6" ry="12.5" transform="rotate(34 9 -14)"/></g>`;
    fans += `<circle cx="${cx}" cy="51" r="31" fill="#0B0B0E" stroke="#4A4A53" stroke-width="2"/>
      <g transform="translate(${cx} 51)"><g class="fan" fill="#3D3D46">${blades}</g></g>
      <circle cx="${cx}" cy="51" r="8" fill="#26262C" stroke="#5A5A63" stroke-width="1.5"/><circle cx="${cx}" cy="51" r="2.6" fill="#EBB447"/>`;
  });
  return `<svg class="art" viewBox="0 0 240 124" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#1C1C21"/></linearGradient></defs>
    <rect x="4" y="10" width="12" height="104" rx="2" fill="#55555E"/>
    <rect x="7" y="22" width="6" height="14" rx="1" fill="#141417"/><rect x="7" y="42" width="6" height="14" rx="1" fill="#141417"/><rect x="7" y="62" width="6" height="10" rx="1" fill="#141417"/>
    <rect x="16" y="96" width="214" height="14" rx="2" fill="#1F1F25"/>
    <g fill="#EBB447">${pins}</g>
    <g stroke="#5A5A63" stroke-width="1.4">${fins}</g>
    <rect x="16" y="8" width="214" height="84" rx="12" fill="url(#${id}s)" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>
    <path d="M30 13h186" stroke="#EBB447" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="196" y="2" width="24" height="8" rx="1.6" fill="#45454D"/>
    ${fans}
  </svg>`;
}
const CHART = `<svg class="art" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" style="width:70%">
  <rect x="4" y="4" width="152" height="112" rx="14" fill="#16161A" stroke="rgba(255,255,255,.14)"/>
  <g stroke="rgba(255,255,255,.07)"><path d="M16 34h128M16 60h128M16 86h128"/></g>
  ${[[24, 80, 92, 74, 98, 1], [42, 74, 84, 66, 90, 0], [60, 82, 66, 60, 88, 1], [78, 66, 72, 58, 78, 0], [96, 70, 50, 44, 74, 1], [114, 52, 58, 46, 64, 0], [132, 56, 32, 26, 60, 1]]
    .map(([x, o, c, hi, lo, up]) => `<line x1="${x}" y1="${hi}" x2="${x}" y2="${lo}" stroke="${up ? "#34C77B" : "#FF5A5F"}" stroke-width="2"/><rect x="${x - 5}" y="${Math.min(o, c)}" width="10" height="${Math.max(3, Math.abs(o - c))}" rx="1.5" fill="${up ? "#34C77B" : "#FF5A5F"}"/>`).join("")}
  <path d="M18 92 L42 82 L60 70 L78 70 L96 52 L114 56 L140 30" fill="none" stroke="#EBB447" stroke-width="2" stroke-linejoin="round" opacity=".55"/>
</svg>`;
function vaultSvg(id) {
  let ticks = "";
  for (let i = 0; i < 24; i++) ticks += `<line x1="80" y1="40" x2="80" y2="${i % 6 ? 45 : 48}" transform="rotate(${i * 15} 80 78)"/>`;
  return `<svg class="art" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" style="width:66%">
    <defs><linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#1B1B20"/></linearGradient></defs>
    <rect x="10" y="8" width="140" height="140" rx="20" fill="url(#${id}v)" stroke="rgba(255,255,255,.18)" stroke-width="1.4"/>
    <rect x="4" y="34" width="10" height="22" rx="3" fill="#55555E"/><rect x="4" y="100" width="10" height="22" rx="3" fill="#55555E"/>
    <rect x="26" y="148" width="22" height="7" rx="2" fill="#2A2A30"/><rect x="112" y="148" width="22" height="7" rx="2" fill="#2A2A30"/>
    <circle cx="80" cy="78" r="50" fill="#121215" stroke="#4A4A53" stroke-width="2"/>
    <circle cx="80" cy="78" r="40" fill="none" stroke="#2C2C33" stroke-width="10"/>
    <g stroke="#6A6A73" stroke-width="1.6">${ticks}</g>
    <g class="dial"><g stroke="#C9C9D0" stroke-width="5" stroke-linecap="round"><path d="M80 78V52M80 78l22.5 13M80 78l-22.5 13"/></g>
    <circle cx="80" cy="52" r="5" fill="#C9C9D0"/><circle cx="102.5" cy="91" r="5" fill="#C9C9D0"/><circle cx="57.5" cy="91" r="5" fill="#C9C9D0"/></g>
    <circle cx="80" cy="78" r="11" fill="#EBB447"/><circle cx="80" cy="78" r="4" fill="#8A6420"/>
  </svg>`;
}
function walletSvg(id) {
  return `<svg class="art" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" style="width:72%">
    <defs><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3C44"/><stop offset="1" stop-color="#1C1C21"/></linearGradient></defs>
    <circle cx="74" cy="40" r="22" fill="#EBB447"/><path d="M67 31l-3 18M78 31l-3 18M62 37h20M61 44h20" stroke="#15110D" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="112" cy="32" r="22" fill="#F0C25E"/><path d="M105 23l-3 18M116 23l-3 18M100 29h20M99 36h20" stroke="#15110D" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="14" y="46" width="172" height="104" rx="18" fill="url(#${id}w)" stroke="rgba(255,255,255,.18)" stroke-width="1.4"/>
    <path d="M14 70h172" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
    <rect x="130" y="84" width="62" height="40" rx="12" fill="#26262C" stroke="rgba(255,255,255,.2)"/>
    <circle cx="150" cy="104" r="7" fill="#EBB447"/>
  </svg>`;
}

// ---------- The world: one loop ----------
const R = 1000;
const rad = (d) => (d * Math.PI) / 180;
const P = (deg, r = R) => [Math.cos(rad(deg)) * r, Math.sin(rad(deg)) * r];
const ANG = { A: 180, B: 235, C: 305, D: 360, E: 415, F: 485 };
const [Ax, Ay] = P(ANG.A), [Bx, By] = P(ANG.B), [Cx, Cy] = P(ANG.C), [Dx, Dy] = P(ANG.D), [Ex, Ey] = P(ANG.E), [Fx, Fy] = P(ANG.F);
const [Qx, Qy] = [Bx - 250, By - 250], [Ux, Uy] = [Bx + 250, By - 250]; // the other two coins sit above Pearl

const T = {
  pour: 5.7, coin: 6.4,
  toA: [8.0, 10.2], A: 10.3, toB: [13.8, 15.6], B: 15.6, pick: [16.2, 16.8, 17.4],
  toC: [19.8, 21.6], C: 21.6, toD: [25.4, 27.1], D: 27.1, toE: [30.6, 32.3], E: 32.3,
  dive: [35.6, 37.0],
  s1: [36.8, 44.6], s2: [44.6, 50.2], s3: [50.2, 57.0], s4: [57.0, 63.6], s5: [63.6, 70.0],
  ret: [69.9, 71.7], back: [72.0, 74.8], out: [77.4, 78.6], end: 78.6,
};

const world = $("world");
const NODES = {};
function addNode(id, x, y, r, inner, label, tr) {
  const el = document.createElement("div");
  el.className = "node";
  el.style.cssText = `left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;`;
  el.innerHTML = `<div class="ring"></div>${inner}${label ? `<div class="nl">${label}</div>` : ""}`;
  world.appendChild(el);
  NODES[id] = { el, tr, ring: el.firstElementChild };
}
const arrive = (a, extra = []) => track([[a, { o: 0, s: 0.6, b: 10 }], [a + 1.0, { o: 1, s: 1, b: 0 }, "back"], ...extra]);

addNode("C", Cx, Cy, 120, '<img class="full" src="assets/coin.svg" alt=""><div class="badge" id="solbadge"><img src="assets/solana.svg" alt=""></div>', "$HASH", arrive(T.coin));
addNode("A", Ax, Ay, 130, gpuSvg("n"), "Your GPU", arrive(T.toA[1] - 0.9));
addNode("Q", Qx, Qy, 76, '<img class="icon" src="assets/quantus.png" alt="">', "Quantus",
  arrive(T.toB[1] - 0.9, [[T.pick[0], {}], [T.pick[0] + 0.25, { g: 1 }], [T.pick[1], {}], [T.pick[1] + 0.25, { g: 0 }], [18.0, {}], [18.7, { o: 0.32 }]]));
addNode("PRL", Bx, By, 84, '<img class="icon" src="assets/pearl-mark.png" alt="" style="width:52%">', "Pearl",
  arrive(T.toB[1] - 0.75, [[T.pick[2], {}], [T.pick[2] + 0.3, { g: 1, s: 1.06 }, "out"], [T.pick[2] + 0.9, { s: 1 }]]));
addNode("U", Ux, Uy, 76, '<img class="icon" src="assets/qubitcoin.png" alt="">', "QubitCoin",
  arrive(T.toB[1] - 0.6, [[T.pick[1], {}], [T.pick[1] + 0.25, { g: 1 }], [T.pick[2], {}], [T.pick[2] + 0.25, { g: 0 }], [18.0, {}], [18.7, { o: 0.32 }]]));
addNode("D", Dx, Dy, 115, CHART, "Traders", arrive(T.toD[1] - 0.8));
addNode("E", Ex, Ey, 115, vaultSvg("n"), "2–5% tax", arrive(T.toE[1] - 0.8, [[T.E + 1.0, {}], [T.E + 1.6, { g: 1 }]]));
addNode("F", Fx, Fy, 115, walletSvg("n"), "Holders and miners", arrive(T.ret[0] + 0.3));
const solbadge = $("solbadge");
const BADGE = track([[T.toC[1] - 0.4, { o: 0, s: 0.4 }], [T.toC[1] + 0.5, { o: 1, s: 1 }, "back"]]);

// ---------- Camera: straight pans between steps ----------
const at = (x, y, z = 1) => ({ x, y, z });
const CAM = track([
  [0, at(Cx, Cy)], [T.toA[0], {}], [T.toA[1], at(Ax, Ay), "sine"],
  [T.toB[0], {}], [T.toB[1], at(Bx, By - 90, 0.94), "sine"],
  [T.toC[0], {}], [T.toC[1], at(Cx, Cy), "sine"],
  [T.toD[0], {}], [T.toD[1], at(Dx + 60, Dy), "sine"],
  [T.toE[0], {}], [T.toE[1], at(Ex, Ey), "sine"],
  // Into the tax: a straight push-in through the vault.
  [T.dive[0], {}], [T.dive[1], { z: 7 }, "in"],
  // Out again at holders and miners, then pull back to the whole loop.
  [T.ret[0] - 0.01, {}], [T.ret[0], at(Fx, Fy - 120, 2.6), "lin"], [T.ret[1], at(Fx, Fy - 120, 0.9), "out"],
  [T.back[0], {}], [T.back[1], at(0, 18, 0.355), "sine"],
  [T.out[0], { z: 0.37 }, "lin"], [T.out[1], { z: 0.3 }, "io"],
], { x: 0, y: 0, z: 1 });
function camera(t) { const c = sample(CAM, t); return { z: c.z, tx: FX - c.x * c.z, ty: FY - c.y * c.z }; }
const WORLD = track([[0, { o: 1 }], [T.dive[0] + 0.7, {}], [T.dive[1], { o: 0 }, "in"], [T.ret[0], {}], [T.ret[0] + 0.6, { o: 1 }, "out"], [T.out[0], {}], [T.out[1], { o: 0 }, "in"]]);

// ---------- Captions, word by word (screen space) ----------
const CAPS = [];
const SOL_IMG = '<img class="sol-mark" src="assets/solana.svg" alt="">';
function caption(text, top, size, t0, t1, sub = false) {
  const el = document.createElement("div");
  el.className = "cap" + (sub ? " sub" : "");
  el.style.top = top + "px"; el.style.fontSize = size + "px";
  el.innerHTML = text.split(" ").map((w) => `<span class="w">${w}</span>`).join(" ").replaceAll("{SOL}", SOL_IMG);
  $("caps").appendChild(el);
  [...el.querySelectorAll(".w")].forEach((w, i) => CAPS.push([w, track([
    [t0 + i * 0.07, { o: 0, y: 16, b: 10 }], [t0 + i * 0.07 + 1.0, { o: 1, y: 0, b: 0 }, "expo"],
    [t1, {}], [t1 + 0.55, { o: 0, y: -8, b: 8 }, "in"],
  ])]));
}
const line = (text, t0, t1) => caption(text, 112, 74, t0, t1);
caption("Most coins need buyers.", 488, 104, 0.6, 3.2);
caption("$HASH makes its own.", 488, 104, 3.7, 5.6);
line("Your GPU mines in the background.", T.A, T.toB[0] - 0.3);
line("It picks the coin that pays most.", T.B + 0.1, T.toC[0] - 0.3);
line("Then it buys $HASH on {SOL}Solana.", T.C + 0.1, T.toD[0] - 0.3);
line("People buy and sell $HASH.", T.D + 0.1, T.toE[0] - 0.3);
line("Every trade pays a 2–5% tax.", T.E + 0.1, T.dive[0] + 0.1);
line("Slow trading? The tax goes up.", T.s1[0] + 0.5, 40.4);
line("Busy trading? It goes down.", 40.95, T.s1[1] - 0.7);
line("The tax is split three ways.", T.s2[0] + 0.4, T.s2[1] - 0.7);
line("Miners get a bonus on top.", T.s3[0] + 0.4, 53.4);
line("Up to 5× their mining, on average.", 53.95, T.s3[1] - 0.7);
line("Holders get paid just for holding.", T.s4[0] + 0.4, 60.1);
line("At least 1% of every trade.", 60.65, T.s4[1] - 0.7);
line("Hold longer and mine more.", T.s5[0] + 0.4, 66.6);
line("Level up for up to 4× the share.", 67.15, T.s5[1] - 0.6);
line("One loop. Around the clock.", T.back[1] - 1.0, T.out[0] - 0.2);
caption("On {SOL}Solana. Coming soon.", 726, 56, T.end + 1.2, 99, true);
const SCREEN = [
  [$("endcoin"), track([[T.end, { o: 0, s: 0.7, b: 14 }], [T.end + 1.2, { o: 1, s: 1, b: 0 }, "back"]])],
  [$("endglow"), track([[T.end + 0.1, { o: 0, s: 0.7 }], [T.end + 1.8, { o: 1, s: 1 }, "out"]])],
  [$("endword"), track([[T.end + 0.5, { o: 0, y: 30, b: 18 }], [T.end + 1.6, { o: 1, y: 0, b: 0 }, "expo"]])],
  [$("fine"), track([[T.end + 2.2, { o: 0 }], [T.end + 3.0, { o: 1 }]])],

// ---------- Slides ----------
const slides = $("slides");
const SLIDE_ITEMS = []; // [el, track]
function slide(t0, t1) {
  const el = document.createElement("div");

  slides.appendChild(el);
  el._tr = track([[t0, { o: 0, s: 0.97, b: 10 }], [t0 + 0.9, { o: 1, s: 1, b: 0 }, "expo"], [t1 - 0.55, {}], [t1, { o: 0, s: 1.02, b: 10 }, "in"]]);

}
function put(parent, html, cls, style, tr) {

}
const pop = (a) => track([[a, { o: 0, s: 0.8, b: 8, y: 14 }], [a + 0.8, { o: 1, s: 1, b: 0, y: 0 }, "back"]]);

// 1. The tax follows trading
const s1 = slide(...T.s1);
const RATE = track([[T.s1[0], { v: 3.25 }], [37.8, {}], [40.3, { v: 5.0 }, "io"], [41.1, {}], [43.8, { v: 2.25 }, "io"]], { v: 3.25 });
const rateEl = put(s1, "3.25%", "big-num", "top:520px;font-size:150px;", null);
put(s1, "tax", "big-num", "top:690px;font-size:36px;font-weight:550;color:#8E8E93;letter-spacing:0;", null);
put(s1, "2%", "t-lab", "left:578px;top:750px;", null);
put(s1, "5%", "t-lab", "left:1300px;top:750px;", null);
put(s1, "Trading", "t-lab", "left:360px;top:982px;font-size:28px;", null);
const VOL = (tb) => {
  const busy = E.io(clamp((tb - 40.3) / 1.0));

};
// 2. The split
const s2 = slide(...T.s2);
const SPLIT = [{ name: "Miners", pct: "45–75%", w: 0.6, c: [235, 180, 71] }, { name: "Holders", pct: "20–50%", w: 0.32, c: [246, 223, 166] }, { name: "Dev", pct: "5–10%", w: 0.08, c: [99, 99, 106] }];
{ let x0 = 0; SPLIT.forEach((sg, i) => { const cx = 360 + (x0 + sg.w / 2) * 1200; sg.x0 = x0; x0 += sg.w; sg.t = T.s2[0] + 1.0 + i * 0.45; put(s2, `<b>${sg.name}</b>`, "seg-lab", `left:${cx}px;top:420px;`, pop(sg.t + 0.3)); put(s2, `<span>${sg.pct}</span>`, "seg-lab", `left:${cx}px;top:650px;`, pop(sg.t + 0.5)); }); }
// 3. Miners: mining, then the bonus stacking on top
const s3 = slide(...T.s3);
put(s3, gpuSvg("m"), "", "left:240px;top:420px;width:640px;", pop(T.s3[0] + 0.6)).firstElementChild.style.width = "100%";
const UNIT = 104, BASE_Y = 900, BAR_X = 1150, BAR_W = 210;
put(s3, "Your mining", "t-lab", `left:${BAR_X + BAR_W + 40}px;top:${BASE_Y - UNIT / 2 - 22}px;color:#F5F5F7;`, pop(51.4));
put(s3, "<b style='color:#EBB447'>Bonus</b>", "t-lab", `left:${BAR_X + BAR_W + 40}px;top:${BASE_Y - UNIT * 3 - 22}px;`, pop(52.6));
put(s3, "up to 5×", "t-lab", `left:${BAR_X + BAR_W + 40}px;top:${BASE_Y - UNIT * 5 - 26}px;color:#EBB447;font-weight:700;`, pop(54.4));
const MINE = track([[51.0, { v: 0 }], [51.8, { v: 1 }, "out"], [52.4, {}], [55.2, { v: 5 }, "io"]], { v: 0 });
// 4. Holders: paid just for holding
const s4 = slide(...T.s4);
put(s4, walletSvg("h"), "", "left:720px;top:470px;width:480px;", pop(T.s4[0] + 0.5)).firstElementChild.style.width = "100%";
// 5. Levels
const s5 = slide(...T.s5);
const cv3 = document.createElement("canvas"); cv3.id = "fx3"; cv3.width = 1920; cv3.height = 1080;
const LEVELS = [{ x: 600, n: 1, m: "1×", rows: 3 }, { x: 960, n: 2, m: "2×", rows: 6 }, { x: 1320, n: 3, m: "4×", rows: 12 }];
LEVELS.forEach((l, i) => { l.t = T.s5[0] + 0.7 + i * 0.35; put(s5, `<div class="lvl">Level ${l.n}</div><div class="mx">${l.m}</div>`, "card" + (i === 2 ? " top" : ""), `left:${l.x}px;`, pop(l.t)); });
s5.appendChild(cv3);
const g3 = cv3.getContext("2d");

// ================= Canvas =================
const cv = $("fx"), g = cv.getContext("2d");
const cv2 = $("fx2"), g2 = cv2.getContext("2d");
const GOLD = [235, 180, 71], WHITE = [242, 242, 246], GRAY = [74, 74, 80], GREEN = [52, 199, 123], RED = [255, 90, 95];
const mixc = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
let seed = 9;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function disc(c2, x, y, r, c, a) { if (a <= 0.005) return; c2.fillStyle = rgba(c, a); c2.beginPath(); c2.arc(x, y, r, 0, 6.2832); c2.fill(); }
function glow(c2, x, y, r, c, a) {
  if (a <= 0.005) return;
  const gr = c2.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0));
  c2.fillStyle = gr; c2.beginPath(); c2.arc(x, y, r, 0, 6.2832); c2.fill();
}
function roundRect(c2, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c2.beginPath(); c2.moveTo(x + r, y); c2.arcTo(x + w, y, x + w, y + h, r); c2.arcTo(x + w, y + h, x, y + h, r); c2.arcTo(x, y + h, x, y, r); c2.arcTo(x, y, x + w, y, r); c2.closePath(); }

// The opening field: every dot is a PC. A wave lights them gold, then they pour into the coin.
const HOOK = [];
{
  const sp = 30, cols = Math.floor(W / sp) + 1, rows = Math.floor(H / sp) + 1;
  const ox = (W - (cols - 1) * sp) / 2, oy = (H - (rows - 1) * sp) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = ox + c * sp, y = oy + r * sp;
    HOOK.push({ x, y, d: Math.hypot((x - FX) / 960, (y - FY) / 600) / Math.SQRT2, j: rnd() });
  }
}
function drawHook(t) {
  if (t > T.coin + 1.2) return;
  for (const p of HOOK) {
    const appear = E.out(clamp((t - 0.2) / 1.2));
    const lit = E.out(clamp((t - (3.9 + p.d * 1.6 + p.j * 0.3)) / 0.6));
    const pour = E.in(clamp((t - (T.pour + (1 - p.d) * 0.5 + p.j * 0.25)) / 1.0));
    const x = lerp(p.x, FX, pour), y = lerp(p.y, FY, pour);
    const a = appear * (0.22 + 0.78 * lit) * (1 - clamp((pour - 0.85) / 0.15));
    if (a <= 0.01) continue;
    const c = mixc(GRAY, GOLD, lit), r = 2.3 * (1 - 0.35 * pour);
    if (lit > 0.3) disc(g, x, y, r * 2.6, c, a * 0.13);
    disc(g, x, y, r, c, a);
  }
}
function drawWorldDots(t, cam, fade) {
  const a = 0.19 * E.out(clamp((t - (T.coin + 0.4)) / 1.5)) * fade;
  if (a <= 0.005) return;
  const sp = 70;
  const x0 = (0 - cam.tx) / cam.z, x1 = (W - cam.tx) / cam.z, y0 = (0 - cam.ty) / cam.z, y1 = (H - cam.ty) / cam.z;
  if ((x1 - x0) / sp > 200) return;
  g.fillStyle = rgba(GRAY, a);
  const r = 1.6 / Math.max(cam.z, 0.5);
  for (let x = Math.floor(x0 / sp) * sp; x <= x1; x += sp) for (let y = Math.floor(y0 / sp) * sp; y <= y1; y += sp) {
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
}
// Links along the loop. Each draws itself on, then carries comets.
const LINKS = [
  { a0: ANG.A, r0: 130, a1: ANG.B, r1: 84, draw: [T.toB[0] + 0.2, T.toB[1] - 0.1], from: T.B - 0.2, n: 3, c: WHITE },
  { a0: ANG.B, r0: 84, a1: ANG.C, r1: 120, draw: [T.toC[0] + 0.2, T.toC[1] - 0.1], from: T.C - 0.2, n: 3, c: GOLD },
  { a0: ANG.C, r0: 120, a1: ANG.D, r1: 115, draw: [T.toD[0] + 0.2, T.toD[1] - 0.1], from: T.D - 0.2, n: 3, c: GOLD },
  { a0: ANG.D, r0: 115, a1: ANG.E, r1: 115, draw: [T.toE[0] + 0.2, T.toE[1] - 0.1], from: T.E - 0.2, n: 4, c: GOLD, small: true },
  { a0: ANG.E, r0: 115, a1: ANG.F, r1: 115, draw: [T.ret[0] + 0.2, T.ret[1] - 0.2], from: T.ret[1] - 0.6, n: 3, c: GOLD },
  { a0: ANG.F, r0: 115, a1: ANG.A + 360, r1: 130, draw: [T.ret[0] + 0.5, T.ret[1]], from: T.ret[1] - 0.4, n: 3, c: GOLD },
];
const SPEED = 430;
function drawLinks(t, fade) {
  for (const L of LINKS) {
    const s = rad(L.a0) + (L.r0 + 26) / R, e = rad(L.a1) - (L.r1 + 26) / R;
    const p = E.io(clamp((t - L.draw[0]) / (L.draw[1] - L.draw[0])));
    if (p <= 0) continue;
    g.strokeStyle = rgba(WHITE, 0.13 * fade); g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, R, s, lerp(s, e, p)); g.stroke();
    if (t < L.from) continue;
    const on = E.out(clamp((t - L.from) / 0.8)) * fade;
    const len = (e - s) * R, tail = (L.small ? 110 : 180) / R, head = L.small ? 5 : 7;
    for (let k = 0; k < L.n; k++) {
      const u = (((t - L.from) * SPEED) / len + k / L.n) % 1;
      const ang = s + (e - s) * u, edge = clamp(Math.min(u, 1 - u) * 10);
      for (let i = 14; i >= 1; i--) {
        const ta = ang - (tail * i) / 14;
        if (ta < s) continue;
        disc(g, Math.cos(ta) * R, Math.sin(ta) * R, head * (1 - i / 16), L.c, on * edge * 0.75 * (1 - i / 14));
      }
      const hx = Math.cos(ang) * R, hy = Math.sin(ang) * R;
      glow(g, hx, hy, head * 6, L.c, on * edge * 0.35);
      disc(g, hx, hy, head, mixc(L.c, WHITE, 0.4), on * edge);
    }
  }
}
function drawGpuRings(t, fade) {
  if (t < T.A - 0.4) return;
  for (let k = 0; k < 3; k++) {
    const ph = (((t - (T.A - 0.4)) / 2.1 + k / 3) % 1);
    g.strokeStyle = rgba(GOLD, (1 - ph) * 0.14 * fade); g.lineWidth = 2;
    g.beginPath(); g.arc(Ax, Ay, 150 + ph * 120, 0, 6.2832); g.stroke();
  }
}
function coinPulse(t) {
  if (t < T.C) return 0;
  const len = (rad(ANG.C) - rad(ANG.B)) * R, per = len / SPEED / 3;
  const ph = ((t - (T.C - 0.2)) % per) / per;
  return Math.exp(-ph * 9) * clamp((t - T.C) / 0.5);
}
function drawTrades(t, fade) {
  const t0 = T.D - 0.6;
  if (t < t0) return;
  g.font = "700 26px Inter"; g.textAlign = "center"; g.textBaseline = "middle";
  for (let k = 0; k < 120; k++) {
    const born = t0 + k * 0.62, life = 2.2, u = (t - born) / life;
    if (u < 0 || u > 1) continue;
    const buy = [0, 1, 0, 0, 1, 0, 1, 0][k % 8] === 0, c = buy ? GREEN : RED;
    const x = Dx + 250 + ((k * 53) % 3 - 1) * 46, y = Dy + 60 - E.out(u) * 230;
    const a = clamp(u / 0.15) * clamp((1 - u) / 0.3) * fade;
    g.fillStyle = rgba(c, 0.16 * a); roundRect(g, x - 62, y - 24, 124, 48, 24); g.fill();
    g.fillStyle = rgba(c, a); g.fillText(buy ? "BUY" : "SELL", x, y + 1);
  }
}

// ---------- Slide drawings ----------
const slideAlpha = (i, t) => sample([s1, s2, s3, s4, s5][i]._tr, t).o;
const coinImg = $("endcoin");
function drawSlides(t) {
  g2.clearRect(0, 0, W, H);
  // 1. Gauge: 2% to 5%, the needle follows the rate; trading bars scroll below.
  let a = slideAlpha(0, t);
  if (a > 0.003) {
    const cx = 960, cy = 690, r = 360, rate = sample(RATE, t).v;
    const k = (rate - 2) / 3, ang = Math.PI + k * Math.PI;
    g2.lineCap = "round"; g2.lineWidth = 26;
    g2.strokeStyle = rgba([40, 40, 46], a); g2.beginPath(); g2.arc(cx, cy, r, Math.PI, 2 * Math.PI); g2.stroke();
    const gr = g2.createLinearGradient(cx - r, 0, cx + r, 0);
    gr.addColorStop(0, rgba([140, 110, 50], a)); gr.addColorStop(1, rgba(GOLD, a));
    g2.strokeStyle = gr; g2.beginPath(); g2.arc(cx, cy, r, Math.PI, ang); g2.stroke();
    glow(g2, cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 70, GOLD, 0.35 * a);
    disc(g2, cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 19, WHITE, a);
    rateEl.textContent = (Math.round(rate * 4) / 4).toFixed(2) + "%";
    // Trading activity: newest bar on the right.
    for (let i = 0; i < 40; i++) {
      const tb = t - (39 - i) * 0.11, v = clamp(VOL(tb), 0.05, 1);
      const h = 14 + v * 120, x = 360 + i * 30;
      g2.fillStyle = rgba(mixc([70, 70, 78], GOLD, clamp((v - 0.3) / 0.6)), a * clamp((t - (T.s1[0] + 0.4 + i * 0.012)) / 0.5));
      roundRect(g2, x, 960 - h, 20, h, 5); g2.fill();
    }
  }
  // 2. The split bar
  a = slideAlpha(1, t);
  if (a > 0.003) {
    const x = 360, y = 520, w = 1200, h = 100;
    g2.save(); roundRect(g2, x, y, w, h, 50); g2.clip();
    g2.fillStyle = rgba([24, 24, 28], a); g2.fillRect(x, y, w, h);
    for (const sg of SPLIT) {
      const p = E.io(clamp((t - sg.t) / 0.9));
      g2.fillStyle = rgba(sg.c, a); g2.fillRect(x + sg.x0 * w, y, sg.w * w * p - (sg.name === "Dev" ? 0 : 3 * p), h);
    }
    g2.restore();
  }
  // 3. Miner bonus: comets from the GPU into the bar, the bar stacks to 5×.
  a = slideAlpha(2, t);
  if (a > 0.003) {
    const v = sample(MINE, t).v;
    g2.strokeStyle = rgba(WHITE, 0.1 * a); g2.lineWidth = 2; g2.setLineDash([3, 10]);
    for (let u = 1; u <= 5; u++) { g2.beginPath(); g2.moveTo(BAR_X - 30, BASE_Y - u * UNIT); g2.lineTo(BAR_X + BAR_W + 24, BASE_Y - u * UNIT); g2.stroke(); }
    g2.setLineDash([]);
    const mine = Math.min(v, 1) * UNIT, bonus = Math.max(0, v - 1) * UNIT;
    g2.fillStyle = rgba(WHITE, 0.92 * a); roundRect(g2, BAR_X, BASE_Y - mine, BAR_W, mine, 10); g2.fill();
    if (bonus > 0) {
      const gr = g2.createLinearGradient(0, BASE_Y - mine - bonus, 0, BASE_Y - mine);
      gr.addColorStop(0, rgba([255, 214, 120], a)); gr.addColorStop(1, rgba(GOLD, a));
      g2.fillStyle = gr; roundRect(g2, BAR_X, BASE_Y - mine - bonus - 6, BAR_W, bonus, 10); g2.fill();
      glow(g2, BAR_X + BAR_W / 2, BASE_Y - mine - bonus, 160, GOLD, 0.22 * a);
    }
    // Comets from the GPU's top edge into the bar while it grows.
    if (t > 51.0 && t < 55.6) for (let k = 0; k < 6; k++) {
      const u = ((t - 51.0) * 0.9 + k / 6) % 1;
      const sx = 860, sy = 520, ex = BAR_X - 10, ey = BASE_Y - mine - bonus + 20;
      const x = lerp(sx, ex, u), y = lerp(sy, ey, u) - Math.sin(u * Math.PI) * 120;
      disc(g2, x, y, 6, v > 1 ? GOLD : WHITE, a * Math.sin(u * Math.PI));
      glow(g2, x, y, 36, v > 1 ? GOLD : WHITE, 0.25 * a * Math.sin(u * Math.PI));
    }
  }
  // 4. Holders: $HASH coins arcing into the wallet.
  a = slideAlpha(3, t);
  if (a > 0.003) {
    let land = 0;
    for (let k = 0; k < 14; k++) {
      const born = T.s4[0] + 1.0 + k * 0.42, u = (t - born) / 1.1;
      if (u >= 1 && u < 1.6) land = Math.max(land, 1 - (u - 1) / 0.6);
      if (u < 0 || u > 1) continue;
      const side = k % 2 ? 1 : -1;
      const sx = 960 + side * (420 + (k % 3) * 60), sy = 360 + (k % 4) * 20, ex = 960 + side * 30, ey = 560;
      const e = E.in(u);
      const x = lerp(sx, ex, e), y = lerp(sy, ey, e) - Math.sin(u * Math.PI) * 140, s = 64 * (1 - 0.3 * u);
      g2.globalAlpha = a * clamp(u / 0.15);
      g2.drawImage(coinImg, x - s / 2, y - s / 2, s, s);
      g2.globalAlpha = 1;
    }
    glow(g2, 960, 690, 420, GOLD, (0.1 + 0.18 * land) * a);
  }
  // 5. Level bars in dots, 1 : 2 : 4.
  g3.clearRect(0, 0, W, H);
  a = 1; // drawn inside the slide, which already fades
  if (slideAlpha(4, t) > 0.003) for (const l of LEVELS) {
    const shown = l.rows * E.out(clamp((t - (l.t + 0.6)) / 1.2));
    for (let r = 0; r < Math.ceil(shown); r++) for (let c = 0; c < 6; c++) {
      disc(g3, l.x - 75 + c * 30, 760 - r * 18, 5, l.n === 3 ? GOLD : mixc(GOLD, WHITE, 0.25), a * clamp(shown - r));
    }
  }
}

// ================= seek =================
function seek(t) {
  const cam = camera(t);
  world.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.z})`;
  const fade = sample(WORLD, t).o;
  world.style.opacity = fade.toFixed(4);
  world.style.visibility = fade < 0.002 ? "hidden" : "visible";
  for (const id in NODES) {
    const n = NODES[id], p = { ...sample(n.tr, t) }; // a copy: the beat below must not write into the track
    if (id === "C") p.s *= 1 + 0.035 * coinPulse(t);
    apply(n.el, p);
    n.ring.style.opacity = p.g.toFixed(3);
  }
  apply(solbadge, sample(BADGE, t));
  for (const [el, tr] of SLIDE_ITEMS) apply(el, sample(tr, t));
  for (const [el, tr] of CAPS) apply(el, sample(tr, t));
  for (const [el, tr] of SCREEN) apply(el, sample(tr, t));
  // Fans spin once the GPU is mining; the vault dial turns as tax comes in.
  const spin = Math.max(0, t - (T.A - 0.6)) * 420;
  for (const f of document.querySelectorAll(".fan")) f.setAttribute("transform", `rotate(${spin % 360})`);
  for (const d of document.querySelectorAll(".dial")) d.setAttribute("transform", `rotate(${(Math.max(0, t - T.E) * 30) % 360} 80 78)`);

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  drawHook(t);
  if (fade > 0.002) {
    g.setTransform(cam.z, 0, 0, cam.z, cam.tx, cam.ty);
    drawWorldDots(t, cam, fade);
    drawGpuRings(t, fade);
    drawLinks(t, fade);
    drawTrades(t, fade);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  drawSlides(t);
}
window.seek = seek;
window.DURATION = DURATION;

if (!navigator.webdriver) {
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = `scale(${k})`; };
  fit(); addEventListener("resize", fit);
  document.fonts.load("700 100px Inter").then(() => {
    const fixed = new URLSearchParams(location.search).get("t");
    if (fixed !== null) seek(Number(fixed));
    else { const t0 = performance.now(); const loop = (n) => { seek(((n - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  });
}
