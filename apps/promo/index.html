<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hashcoin promo</title>
<!--
  The Hashcoin promo film (v7, about 58 s).
  - Opening: a field of dots (every dot a PC) pours into the $HASH coin.
  - The system: the coin sits large in the centre and every other step orbits it (graphics card,
    Pearl with Quantus and QubitCoin, traders, the tax vault, holders and miners). The orbit turns
    to bring each step to the front-left.
  - Inside the tax (an iris opens from the vault): the tax and split moving with the market, the
    miner bonus, a holder example (% of the bag a day), the levels. Slides push left.
  - Out again (the iris closes): the whole system spins, collapses into the coin, end card.
  Every frame is a pure function of time: seek(t) sets the whole stage for t seconds, so
  render.mjs can step through it. Open this file in a browser to watch it loop, or add ?t=12.5
  to freeze on a moment.
  Third-party marks, used unaltered: Pearl, Quantus and QubitCoin marks (supplied by the user),
  the Solana logomark (solana.com/branding).
-->
<style>
  @font-face { font-family: "Inter"; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; }
  :root { --white: #F5F5F7; --gray: #8E8E93; --fine: #6E6E73; --gold: #EBB447; --gold-2: #F6DFA6; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--white); background: #060607;
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transform-origin: 0 0; }
  canvas, #world, #slides, #caps, #vignette, #endglow { position: absolute; left: 0; top: 0; }
  #world { width: 0; height: 0; transform-origin: 0 0; }
  #slides, #caps, #vignette { width: 1920px; height: 1080px; }
  #slides { background: #060607; overflow: hidden; }
  #vignette { pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 55%, transparent 55%, rgba(0,0,0,.6) 100%); }
  .abs { position: absolute; }
  /* The system (world space) */
  .node { position: absolute; left: 0; top: 0; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #1F1F24 0%, #131316 60%, #0C0C0E 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.6); }
  .node .ring { position: absolute; inset: -14px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 60px rgba(235,180,71,.35), inset 0 0 30px rgba(235,180,71,.12); opacity: 0; }
  .node .icon { width: 50%; height: 50%; object-fit: contain; }
  .node .art { width: 74%; height: auto; }
  .nl { position: absolute; left: 50%; top: calc(100% + 26px); transform: translateX(-50%); white-space: nowrap; font-size: 46px; font-weight: 600; letter-spacing: -.015em; color: #D1D1D6; opacity: 0; }
  #coin { position: absolute; left: 785px; top: 455px; width: 350px; height: 350px; z-index: 50; }
  #coin > img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 30px 70px rgba(0,0,0,.7)); }
  #coinglow { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(235,180,71,.20), rgba(235,180,71,.05) 55%, transparent 80%); }
  #sheen { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  #sheen i { position: absolute; top: -10%; bottom: -10%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,250,230,.55) 50%, transparent); transform: translateX(-200%) skewX(-12deg); }
  #solbadge { position: absolute; right: 2%; bottom: 2%; width: 30%; height: 30%; border-radius: 50%; background: #0C0C0E; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 10px 30px rgba(0,0,0,.6); display: grid; place-items: center; }
  #solbadge img { width: 52%; }
  /* Slides (screen space) */
  .slide { position: absolute; inset: 0; }
  .big-num { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .t-lab { position: absolute; font-size: 34px; font-weight: 600; color: var(--gray); letter-spacing: -.01em; white-space: nowrap; }
  .t-lab b { color: var(--white); font-weight: 650; }
  .seg { position: absolute; top: 832px; text-align: center; white-space: nowrap; }
  .seg > div { transform: translateX(-50%); }
  .seg span { display: block; font-size: 34px; color: #AEAEB2; font-weight: 600; letter-spacing: -.01em; }
  .seg b { display: block; font-size: 58px; font-weight: 720; letter-spacing: -.04em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hold-big { position: absolute; left: 1010px; top: 372px; font-size: 210px; font-weight: 720; letter-spacing: -.055em; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
  .hold-l1 { position: absolute; left: 1018px; top: 610px; font-size: 48px; font-weight: 640; letter-spacing: -.02em; }
  .hold-l2 { position: absolute; left: 1018px; top: 690px; font-size: 38px; font-weight: 550; color: var(--gray); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .hold-fine { position: absolute; left: 0; right: 0; top: 996px; text-align: center; font-size: 26px; color: #85858A; font-weight: 500; }
  .card { position: absolute; width: 340px; margin-left: -170px; border-radius: 30px; background: linear-gradient(180deg, #19191D, #0E0E10); box-shadow: inset 0 0 0 2px rgba(255,255,255,.09), 0 30px 80px rgba(0,0,0,.6); text-align: center; }
  .card .lvl { margin-top: 26px; font-size: 36px; font-weight: 650; color: #E5E5EA; letter-spacing: -.01em; }
  .card .mx { position: absolute; left: 0; right: 0; top: 70px; font-size: 100px; font-weight: 740; letter-spacing: -.05em; color: var(--gold); line-height: 1.05; }
  .card .rq { position: absolute; left: 0; right: 0; top: 196px; font-size: 36px; font-weight: 640; letter-spacing: -.015em; }
  .card .rq span { display: block; font-size: 30px; font-weight: 520; color: var(--gray); margin-top: 6px; letter-spacing: -.005em; }
  .card.top { box-shadow: inset 0 0 0 2px rgba(235,180,71,.5), 0 0 80px rgba(235,180,71,.16), 0 30px 80px rgba(0,0,0,.6); }
  /* Captions (screen space) */
  .cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 640; letter-spacing: -.035em; line-height: 1.1; color: var(--white); }
  .cap .w { display: inline-block; white-space: pre; }
  .cap.sub { color: #A1A1A6; font-weight: 540; letter-spacing: -.015em; }
  .sol-mark { display: inline-block; height: .7em; width: auto; vertical-align: -.03em; margin-right: .2em; }
  #endglow { left: 50%; top: 350px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(235,180,71,.22), rgba(235,180,71,.06) 50%, transparent 75%); }
  #endword { position: absolute; left: 0; right: 0; top: 490px; text-align: center; font-size: 200px; font-weight: 720; letter-spacing: -.055em; line-height: 1; }
  #chips { position: absolute; left: 0; right: 0; top: 818px; display: flex; justify-content: center; gap: 28px; }
  .chip { display: flex; align-items: center; gap: 20px; padding: 20px 34px 20px 26px; border-radius: 26px; background: #111114; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); text-align: left; }
  .chip svg { width: 46px; height: 46px; fill: none; stroke: #EBB447; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .chip b { display: block; font-size: 34px; font-weight: 650; letter-spacing: -.015em; }
  .chip span { display: block; font-size: 26px; color: var(--gray); font-weight: 520; margin-top: 2px; }
  #fine { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-size: 26px; color: var(--fine); font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="endglow"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="world"></div>
  <canvas id="fxw" width="1920" height="1080"></canvas>
  <div id="slides"></div>
  <canvas id="fxo" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div id="caps">
    <div id="endword">$HASH</div>
    <div id="chips">
      <div class="chip" id="chip1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg><div><b>Website</b><span>Coming soon</span></div></div>
      <div class="chip" id="chip2"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg><div><b>Windows app</b><span>Coming soon</span></div></div>
    </div>
    <div id="fine">Not financial advice. Never share your seed phrase. Not affiliated with Pearl, Quantus, QubitCoin or the Solana Foundation.</div>
  </div>
  <div style="display:none"><img id="coinimg" src="assets/coin.svg" alt=""><img id="pearlimg" src="assets/pearl-mark.png" alt=""></div>
</div>

<script>
"use strict";
const STORY = 58.5; // the timeline below is written at this length; the reading pace stretches it (see PACE)
const W = 1920, H = 1080, CX = 960, CY = 630; // the coin sits here; the orbit turns around it
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  sine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  back: (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2),
};

// ---------- Tracks: [time, props, ease]; props carry forward ----------
function track(keys, def = { o: 0, x: 0, y: 0, s: 1, b: 0, g: 0 }) {
  let cur = { ...def };
  return keys.map(([t, p, e]) => { cur = { ...cur, ...p }; return [t, { ...cur }, e || "io"]; });
}
function sample(tr, t) {
  if (t <= tr[0][0]) return { ...tr[0][1] };
  for (let i = 1; i < tr.length; i++) {
    const [t1, p1, e] = tr[i];
    if (t <= t1) {
      const [t0, p0] = tr[i - 1];
      const k = E[e](clamp((t - t0) / (t1 - t0)));
      const r = {};
      for (const key in p1) r[key] = p0[key] + (p1[key] - p0[key]) * k;
      return r;
    }
  }
  return { ...tr[tr.length - 1][1] };
}
const val = (keys, v0 = 0) => track(keys.map(([t, v, e]) => [t, v === null ? {} : { v }, e]), { v: v0 });
const V = (tr, t) => sample(tr, t).v;
function apply(el, p) {
  el.style.opacity = p.o.toFixed(4);
  el.style.visibility = p.o < 0.002 ? "hidden" : "visible";
  el.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.s})`;
  el.style.filter = p.b > 0.05 ? `blur(${p.b.toFixed(2)}px)` : "none";
}

// ---------- Timeline ----------
const T = {
  light: 2.9, pour: 4.7, coin: 5.4, unfold: 5.85,
  gpu: [6.9, 9.5], pick: [7.9, 8.4, 8.9],
  rot1: [9.6, 10.4], pearl: [10.3, 12.7],
  rot2: [12.8, 13.6], trade: [13.5, 15.6],
  rot3: [15.7, 16.5], tax: [16.4, 18.7],
  iris: [18.6, 19.5],
  A: 19.2, B: 28.6, C: 34.4, D: 41.2, push: 0.8,
  close: [48.6, 49.5], loop: [49.4, 51.9], collapse: [52.1, 53.3], end: 53.4,
};

// ---------- Illustrations ----------
function gpuSvg(id) {
  let fins = "", pins = "", fans = "";
  for (let x = 26; x <= 222; x += 5) fins += `<line x1="${x}" y1="90" x2="${x}" y2="99"/>`;
  for (let x = 48; x <= 150; x += 4.2) pins += `<rect x="${x.toFixed(1)}" y="110" width="2.6" height="9" rx=".6"/>`;
  [66, 123, 180].forEach((cx) => {
    let blades = "";
    for (let i = 0; i < 9; i++) blades += `<g transform="rotate(${i * 40})"><ellipse cx="9" cy="-14" rx="6" ry="12.5" transform="rotate(34 9 -14)"/></g>`;
    fans += `<circle cx="${cx}" cy="51" r="31" fill="#0B0B0E" stroke="#4A4A53" stroke-width="2"/>
      <g transform="translate(${cx} 51)"><g class="fan" fill="#3D3D46">${blades}</g></g>
      <circle cx="${cx}" cy="51" r="8" fill="#26262C" stroke="#5A5A63" stroke-width="1.5"/><circle cx="${cx}" cy="51" r="2.6" fill="#EBB447"/>`;
  });
  return `<svg class="art" viewBox="0 0 240 124" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#1C1C21"/></linearGradient></defs>
    <rect x="4" y="10" width="12" height="104" rx="2" fill="#55555E"/>
    <rect x="7" y="22" width="6" height="14" rx="1" fill="#141417"/><rect x="7" y="42" width="6" height="14" rx="1" fill="#141417"/><rect x="7" y="62" width="6" height="10" rx="1" fill="#141417"/>
    <rect x="16" y="96" width="214" height="14" rx="2" fill="#1F1F25"/>
    <g fill="#EBB447">${pins}</g>
    <g stroke="#5A5A63" stroke-width="1.4">${fins}</g>
    <rect x="16" y="8" width="214" height="84" rx="12" fill="url(#${id}s)" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>
    <path d="M30 13h186" stroke="#EBB447" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="196" y="2" width="24" height="8" rx="1.6" fill="#45454D"/>
    ${fans}
  </svg>`;
}
const CHART = `<svg class="art" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg" style="width:70%">
  <rect x="4" y="4" width="152" height="112" rx="14" fill="#16161A" stroke="rgba(255,255,255,.14)"/>
  <g stroke="rgba(255,255,255,.07)"><path d="M16 34h128M16 60h128M16 86h128"/></g>
  ${[[24, 80, 92, 74, 98, 1], [42, 74, 84, 66, 90, 0], [60, 82, 66, 60, 88, 1], [78, 66, 72, 58, 78, 0], [96, 70, 50, 44, 74, 1], [114, 52, 58, 46, 64, 0], [132, 56, 32, 26, 60, 1]]
    .map(([x, o, c, hi, lo, up]) => `<line x1="${x}" y1="${hi}" x2="${x}" y2="${lo}" stroke="${up ? "#34C77B" : "#FF5A5F"}" stroke-width="2"/><rect x="${x - 5}" y="${Math.min(o, c)}" width="10" height="${Math.max(3, Math.abs(o - c))}" rx="1.5" fill="${up ? "#34C77B" : "#FF5A5F"}"/>`).join("")}
  <path d="M18 92 L42 82 L60 70 L78 70 L96 52 L114 56 L140 30" fill="none" stroke="#EBB447" stroke-width="2" stroke-linejoin="round" opacity=".55"/>
</svg>`;
function vaultSvg(id) {
  let ticks = "";
  for (let i = 0; i < 24; i++) ticks += `<line x1="80" y1="40" x2="80" y2="${i % 6 ? 45 : 48}" transform="rotate(${i * 15} 80 78)"/>`;
  return `<svg class="art" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" style="width:66%">
    <defs><linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#1B1B20"/></linearGradient></defs>
    <rect x="10" y="8" width="140" height="140" rx="20" fill="url(#${id}v)" stroke="rgba(255,255,255,.18)" stroke-width="1.4"/>
    <rect x="4" y="34" width="10" height="22" rx="3" fill="#55555E"/><rect x="4" y="100" width="10" height="22" rx="3" fill="#55555E"/>
    <rect x="26" y="148" width="22" height="7" rx="2" fill="#2A2A30"/><rect x="112" y="148" width="22" height="7" rx="2" fill="#2A2A30"/>
    <circle cx="80" cy="78" r="50" fill="#121215" stroke="#4A4A53" stroke-width="2"/>
    <circle cx="80" cy="78" r="40" fill="none" stroke="#2C2C33" stroke-width="10"/>
    <g stroke="#6A6A73" stroke-width="1.6">${ticks}</g>
    <g class="dial"><g stroke="#C9C9D0" stroke-width="5" stroke-linecap="round"><path d="M80 78V52M80 78l22.5 13M80 78l-22.5 13"/></g>
    <circle cx="80" cy="52" r="5" fill="#C9C9D0"/><circle cx="102.5" cy="91" r="5" fill="#C9C9D0"/><circle cx="57.5" cy="91" r="5" fill="#C9C9D0"/></g>
    <circle cx="80" cy="78" r="11" fill="#EBB447"/><circle cx="80" cy="78" r="4" fill="#8A6420"/>
  </svg>`;
}
function walletSvg(id) {
  return `<svg class="art" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" style="width:72%">
    <defs><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3C44"/><stop offset="1" stop-color="#1C1C21"/></linearGradient></defs>
    <circle cx="74" cy="40" r="22" fill="#EBB447"/><path d="M67 31l-3 18M78 31l-3 18M62 37h20M61 44h20" stroke="#15110D" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="112" cy="32" r="22" fill="#F0C25E"/><path d="M105 23l-3 18M116 23l-3 18M100 29h20M99 36h20" stroke="#15110D" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="14" y="46" width="172" height="104" rx="18" fill="url(#${id}w)" stroke="rgba(255,255,255,.18)" stroke-width="1.4"/>
    <path d="M14 70h172" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
    <rect x="130" y="84" width="62" height="40" rx="12" fill="#26262C" stroke="rgba(255,255,255,.2)"/>
    <circle cx="150" cy="104" r="7" fill="#EBB447"/>
  </svg>`;
}

// ---------- The system: the coin in the middle, five steps orbiting it ----------
const world = $("world");
const RX = 700, RY = 300, NR = 105, MR = 52;
const rad = (d) => (d * Math.PI) / 180;
{
  const c = document.createElement("div");
  c.id = "coin";
  c.innerHTML = '<div id="coinglow"></div><img src="assets/coin.svg" alt=""><div id="sheen"><i></i></div><div id="solbadge"><img src="assets/solana.svg" alt=""></div>';
  world.appendChild(c);
}
const COIN = track([[T.coin, { o: 0, s: 0.55, b: 12 }], [T.coin + 1.0, { o: 1, s: 1, b: 0 }, "back"], [T.collapse[0] + 0.3, {}], [T.end, { y: -280, s: 100 / 175 }, "io"]]);
const COINGLOW = val([[T.coin, 0], [T.coin + 1.4, 1, "out"], [T.collapse[0] + 0.3, null], [T.end, 0]]);
const BADGE = track([[T.pearl[0] + 0.2, { o: 0, s: 0.4 }], [T.pearl[0] + 0.9, { o: 1, s: 1 }, "back"]]);
const SHEENS = [T.coin + 0.7, T.pearl[0] + 0.7, T.end + 0.9];

function makeNode(inner, label, r) {
  const el = document.createElement("div");
  el.className = "node";
  el.style.width = el.style.height = 2 * r + "px";
  el.innerHTML = `<div class="ring"></div>${inner}${label ? `<div class="nl">${label}</div>` : ""}`;
  world.appendChild(el);
  return { el, r, ring: el.querySelector(".ring"), lab: el.querySelector(".nl") };
}
// Each step is in focus for its beat: brighter, bigger, ringed and labelled.
const NODES = [
  { id: "gpu", inner: gpuSvg("n"), label: "Your GPU", focus: val([[T.gpu[0] - 0.2, 0], [T.gpu[0] + 0.3, 1], [T.gpu[1], null], [T.rot1[0] + 0.5, 0]]) },
  { id: "prl", inner: '<img class="icon" src="assets/pearl-mark.png" alt="" style="width:52%">', label: "Pearl", focus: val([[T.rot1[1] - 0.4, 0], [T.rot1[1] + 0.1, 1], [T.pearl[1], null], [T.rot2[0] + 0.4, 0]]) },
  { id: "trd", inner: CHART, label: "Traders", focus: val([[T.rot2[1] - 0.4, 0], [T.rot2[1] + 0.1, 1], [T.trade[1], null], [T.rot3[0] + 0.5, 0]]) },
  { id: "tax", inner: vaultSvg("n"), label: "2–5% tax", focus: val([[T.rot3[1] - 0.4, 0], [T.rot3[1] + 0.1, 1], [T.close[0] - 0.5, null], [T.close[0] - 0.4, 0]]) },
  { id: "wal", inner: walletSvg("n"), label: "Holders and miners", focus: val([[0, 0]]) },
];
NODES.forEach((n) => Object.assign(n, makeNode(n.inner, n.label, NR)));
const MOONS = [
  { id: "q", ...makeNode('<img class="icon" src="assets/quantus.png" alt="" style="width:56%;height:56%">', "Quantus", MR), dx: -170, dy: -40,
    ringTr: val([[T.pick[0], 0], [T.pick[0] + 0.2, 1], [T.pick[1], null], [T.pick[1] + 0.2, 0]]) },
  { id: "u", ...makeNode('<img class="icon" src="assets/qubitcoin.png" alt="" style="width:56%;height:56%">', "QubitCoin", MR), dx: 170, dy: -40,
    ringTr: val([[T.pick[1], 0], [T.pick[1] + 0.2, 1], [T.pick[2], null], [T.pick[2] + 0.2, 0]]) },
];
// The Pearl group wakes up for the pick while the graphics card is in focus.
const PICK = val([[T.pick[0] - 0.6, 0], [T.pick[0] - 0.2, 1], [T.gpu[1], null], [T.rot1[0] + 0.4, 0]]);

}
// How hard the coin beats as buys land (the Pearl-to-$HASH tokens below arrive at born + 1).
function coinBeat(t) {
  let b = 0;
  for (let k = 0; k < 12; k++) { const u = t - (T.pearl[0] + 0.1 + k * 0.19 + 1.0); if (u >= 0) b += Math.exp(-u * 9); }
  return Math.min(1, b);
}
function drawFlows(t, N, M, fade) {
  // The graphics card checks all three coins, then mines Pearl.
  const gpuA = clamp((t - (T.pick[0] - 0.5)) / 0.4) * (1 - clamp((t - T.rot1[0]) / 0.4)) * fade;
  if (gpuA > 0) {
    const qa = 1 - clamp((t - (T.pick[2] + 0.1)) / 0.4);
    beam(g, N.gpu, M.q, WHITE, gpuA * qa * (0.45 + 0.55 * V(MOONS[0].ringTr, t)), t, T.pick[0] - 0.5, 2);
    beam(g, N.gpu, M.u, WHITE, gpuA * qa * (0.45 + 0.55 * V(MOONS[1].ringTr, t)), t, T.pick[0] - 0.4, 2);
    const pk = clamp((t - T.pick[2]) / 0.3);
    beam(g, N.gpu, N.prl, mixc(WHITE, GOLD, pk), gpuA * (0.45 + 0.55 * pk), t, T.pick[0] - 0.3, 3);
  }
  // Pearl is sold and $HASH is bought: tokens flip from Pearl to $HASH on the way into the coin.
  const C = { x: CX, y: CY };
  for (let k = 0; k < 12; k++) {
    const born = T.pearl[0] + 0.1 + k * 0.19, u = (t - born) / 1.0;
    if (u < 0 || u >= 1) continue;
    const S = N.prl, side = (k % 3) - 1;
    const x = lerp(S.x, C.x - 60, E.io(u)), y = lerp(S.y + side * 30, C.y + side * 40, E.io(u)) - Math.sin(u * Math.PI) * 170;
    token(gw, x, y, 30, Math.cos(u * Math.PI * 3), u < 0.5 ? "pearl" : "hash", fade * clamp(u / 0.1) * clamp((1 - u) / 0.12));
  }
  // Traders: buys and sells run in and out of the coin; tags rise off the chart.
  const trA = clamp((t - (T.rot2[1] - 0.3)) / 0.5) * (1 - clamp((t - (T.tax[1] - 0.4)) / 0.4)) * fade;
  if (trA > 0) {
    const S = N.trd;

    for (let k = 0; k < 24; k++) {

      const x = S.x + ((k * 53) % 3 - 1) * 70, y = S.y - S.r - 30 - E.out(u) * 190;
      const a = clamp(u / 0.15) * clamp((1 - u) / 0.3) * trA * (t < T.rot3[0] ? 1 : 0.5);
      gw.fillStyle = rgba(c, 0.16 * a); roundRect(gw, x - 62, y - 24, 124, 48, 24); gw.fill();
      gw.fillStyle = rgba(c, a); gw.fillText(buy ? "BUY" : "SELL", x, y + 1);
    }
    const toCoin = { x: CX, y: CY, r: 185 };
    beam(g, S, toCoin, GREEN, trA * 0.8, t, T.rot2[1], 2, 420, 5);

      const x = lerp(S.x + ((k % 3) - 1) * 30, D.x, E.io(u)), y = lerp(S.y - 40, D.y, E.io(u)) - Math.sin(u * Math.PI) * 120;
      token(gw, x, y, 18, Math.cos(u * Math.PI * 2), "hash", txA * clamp(u / 0.1) * clamp((1 - u) / 0.1));

}

// ---------- Slide drawings ----------
function drawA(s, t) {
  const c2 = s.b, mk = market(V(MKT, t));
  // Trading activity: newest bar on the right.
  for (let i = 0; i < 36; i++) {
    const tb = t - (35 - i) * 0.11, mv = V(MKT, tb);
    const v = clamp(0.1 + 0.78 * mv + 0.07 * Math.sin(tb * 9.1 + i) + 0.05 * Math.sin(tb * 23.7), 0.05, 1);
    const h = 14 + v * 110, x = 420 + i * 30;
    c2.fillStyle = rgba(mixc([70, 70, 78], GOLD, clamp((v - 0.3) / 0.6)), clamp((t - (T.A + 0.4 + i * 0.012)) / 0.5));
    roundRect(c2, x, 450 - h, 20, h, 5); c2.fill();

  // The 2–5% track with its knob.

  c2.lineCap = "round"; c2.lineWidth = 10;

  c2.strokeStyle = rgba(GOLD, ma); c2.beginPath(); c2.moveTo(760, 650); c2.lineTo(kx, 650); c2.stroke();
  glow(c2, kx, 650, 50, GOLD, 0.35 * ma); disc(c2, kx, 650, 13, WHITE, ma);
  // The split bar: miners, holders, dev, resizing as the market moves.

  const pct = [mk.m, 100 - mk.m - mk.d, mk.d];
  const shown = [Math.round(mk.m), 0, Math.round(mk.d)]; shown[1] = 100 - shown[0] - shown[2];
  c2.save(); roundRect(c2, x, y, w, h, 48); c2.clip();
  c2.fillStyle = "#18181C"; c2.fillRect(x, y, w, h);
  let x0 = x;

    c2.fillStyle = rgba(sg.c, 1); c2.fillRect(x0, y, sw * p - (i < 2 ? 4 * p : 0), h);
    sg.el.style.left = x0 + sw / 2 + "px";

    x0 += sw;
  });
  c2.restore();
  // Light the side that gains: miners when slow, holders when busy.
  const v = V(MKT, t), slow = clamp((0.5 - v) / 0.5) * clamp((25.8 - t) / 0.4), busy = clamp((v - 0.5) / 0.5);
  const mx = x + (pct[0] / 200) * w, hx = x + ((pct[0] + pct[1] / 2) / 100) * w;
  glow(c2, mx, y + h / 2, 300, GOLD, 0.28 * slow);

}
function drawB(s, t) {
  const c2 = s.b, f = s.f, v = V(MINE, t);
  c2.strokeStyle = rgba(WHITE, 0.1); c2.lineWidth = 2; c2.setLineDash([3, 10]);
  for (let u = 1; u <= 5; u++) { c2.beginPath(); c2.moveTo(BAR_X - 30, BASE_Y - u * UNIT); c2.lineTo(BAR_X + BAR_W + 24, BASE_Y - u * UNIT); c2.stroke(); }
  c2.setLineDash([]);
  const mine = Math.min(v, 1) * UNIT, bonus = Math.max(0, v - 1) * UNIT;

  if (bonus > 0) {

    gr.addColorStop(0, "rgb(255,214,120)"); gr.addColorStop(1, rgba(GOLD, 1));

    if (u < 0 || u > 1) continue;

function drawC(s, t) {
  const c2 = s.b, f = s.f, dx = V(WAL_X, t), cx = 960 + dx, cy = 622;

  // A day goes round the wallet.

function drawD(s, t) {
  const f = s.f;
  LEVELS.forEach((l, i) => {
    const base = CARD_BOTTOM - 40, split = E.io(clamp((t - l.tm) / 0.7));
    const cardIn = sample(l.cardTr, t);
    if (cardIn.o < 0.01) return;
    for (let j = 0; j < l.copies; j++) {
      const off = (j - (l.copies - 1) / 2) * 74 * split, ca = j === 0 ? 1 : split;
      for (let k = 0; k < l.coins; k++) {
        const land = T.D + 1.0 + i * 0.35 + k * 0.1, u = clamp((t - (land - 0.35)) / 0.35);
        if (u <= 0) continue;

const DRAW = [drawA, drawB, drawC, drawD];

// ================= seek =================
function seekStory(t) {
  const cam = camera(t);
  const N = layout(t);
  const fade = V(WORLD, t);
  world.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.z})`;
  world.style.opacity = fade.toFixed(4);
  world.style.visibility = fade < 0.002 ? "hidden" : "visible";
  // Nodes
  const dim = V(DIM, t), pick = V(PICK, t), loopLab = V(LOOPLAB, t);
  NODES.forEach((n) => {
    const p = N[n.id], f = V(n.focus, t), extra = n.id === "prl" ? pick : 0;
    const o = Math.max(dim, f, extra) * clamp(p.sp * 1.4);
    const s = p.s * (1 + 0.22 * f) * (0.35 + 0.65 * p.sp);
    p.r = NR * s;
    n.el.style.transform = `translate(${p.x - NR}px, ${p.y - NR}px) scale(${s})`;
    n.el.style.opacity = o.toFixed(3);
    n.el.style.visibility = o < 0.002 ? "hidden" : "visible";
    n.el.style.zIndex = 10 + Math.round(p.d * 80);
    n.ring.style.opacity = Math.max(f, n.id === "prl" ? V(PEARL_RING, t) : 0).toFixed(3);
    n.lab.style.opacity = Math.max(f, extra, loopLab * clamp((p.d - 0.2) / 0.25)).toFixed(3);
  });
  const M = {};
  MOONS.forEach((m, i) => {
    const P = N.prl, wob = Math.sin(t * 1.3 + i * 2) * 8;
    const s = P.s * (0.35 + 0.65 * P.sp), x = P.x + (m.dx + wob) * s * P.sp, y = P.y + (m.dy - wob) * s * P.sp;
    const o = Math.max(dim, pick) * V(MOON_DIM, t) * clamp(P.sp * 1.4);
    M[m.id] = { x, y, r: MR * s };
    m.el.style.transform = `translate(${x - MR}px, ${y - MR}px) scale(${s})`;
    m.el.style.opacity = o.toFixed(3);
    m.el.style.visibility = o < 0.002 ? "hidden" : "visible";
    m.el.style.zIndex = 9 + Math.round(P.d * 80);
    m.ring.style.opacity = V(m.ringTr, t).toFixed(3);
    m.lab.style.opacity = pick.toFixed(3);
    m.lab.style.fontSize = "40px";
  });
  // The coin: it beats as buys land, and a sheen crosses it now and then.
  const cp = sample(COIN, t), landed = coinBeat(t);
  cp.s *= 1 + 0.045 * landed;
  apply($("coin"), cp);
  $("coinglow").style.opacity = (V(COINGLOW, t) * (1 + 0.6 * landed)).toFixed(3);
  apply($("solbadge"), sample(BADGE, t));
  let sh = -2;
  for (const s0 of SHEENS) if (t > s0 && t < s0 + 0.9) sh = lerp(-1.2, 2.6, E.io((t - s0) / 0.9));
  $("sheen").firstElementChild.style.transform = `translateX(${sh * 100}%) skewX(-12deg)`;
  // Fans spin once the GPU is mining; the vault dial turns as tax comes in.
  const spinDeg = Math.max(0, t - (T.gpu[0] - 0.6)) * 420;
  for (const fan of document.querySelectorAll(".fan")) fan.setAttribute("transform", `rotate(${spinDeg % 360})`);
  for (const d of document.querySelectorAll(".dial")) d.setAttribute("transform", `rotate(${(Math.max(0, t - T.rot3[1]) * 60) % 360} 80 78)`);

  // World canvases
  for (const c2 of [g, gw]) { c2.setTransform(1, 0, 0, 1, 0, 0); c2.clearRect(0, 0, W, H); }
  drawHook(t);
  if (fade > 0.002) {
    for (const c2 of [g, gw]) c2.setTransform(cam.z, 0, 0, cam.z, cam.tx, cam.ty);
    drawOrbit(t, N, fade);
    drawGpuRings(t, N.gpu, fade);
    drawFlows(t, N, M, fade);
    for (const c2 of [g, gw]) c2.setTransform(1, 0, 0, 1, 0, 0);
  }

  // Slides and the iris
  const vault = { x: N.tax.x * cam.z + cam.tx, y: N.tax.y * cam.z + cam.ty };
  const ir = iris(t, vault);
  go.clearRect(0, 0, W, H);
  slides.style.display = ir ? "block" : "none";
  slides.style.clipPath = ir && !ir.full ? `circle(${ir.r.toFixed(1)}px at ${ir.x.toFixed(1)}px ${ir.y.toFixed(1)}px)` : "none";
  if (ir && !ir.full && ir.r > 2) {
    const a = Math.sin(clamp(ir.k) * Math.PI);
    go.strokeStyle = rgba(GOLD, 0.9 * a); go.lineWidth = 5;
    go.beginPath(); go.arc(ir.x, ir.y, ir.r, 0, 6.2832); go.stroke();
    go.strokeStyle = rgba(GOLD, 0.18 * a); go.lineWidth = 40;
    go.beginPath(); go.arc(ir.x, ir.y, ir.r, 0, 6.2832); go.stroke();
  }
  for (const [el, tr] of SLIDE_ITEMS) apply(el, sample(tr, t));
  SLIDES.forEach((s, i) => {
    const x = ir ? sample(s.tr, t).x : W;
    const on = Math.abs(x) < W - 1;
    s.el.style.display = on ? "block" : "none";
    // A touch of blur while a slide is moving.
    const bl = 9 * Math.sin((Math.abs(x) / W) * Math.PI);
    s.el.style.transform = `translateX(${x.toFixed(1)}px)`;
    s.el.style.filter = bl > 0.3 ? `blur(${bl.toFixed(2)}px)` : "none";
    if (on || s.dirty) { s.b.clearRect(0, 0, W, H); s.f.clearRect(0, 0, W, H); s.dirty = false; }
    if (on) { DRAW[i](s, t); s.dirty = true; }
  });

  for (const [el, tr] of CAPS) apply(el, sample(tr, t));
  for (const [el, tr] of SCREEN) apply(el, sample(tr, t));
}
// ---------- Pace: slow down where there is something to read, keep the moves at full speed ----------
// [from, to, rate] in story time; rate 0.7 plays that stretch at 70% speed. Rates ease in and out
// over 0.4 s so nothing visibly changes gear.
const PACE = [
  [0.4, 4.7, 0.85],                                            // opening lines
  [7.2, 9.5, 0.7], [10.5, 12.7, 0.7], [13.7, 15.6, 0.7], [16.6, 18.5, 0.7], // one line per step
  [19.6, 28.4, 0.66], [29.4, 34.3, 0.7], [35.2, 41.1, 0.68], [42.0, 48.4, 0.68], // slides
  [49.6, 52.0, 0.8], [53.4, STORY, 0.8],                       // the loop and the end card
];
function rateAt(x) {
  let r = 1;
  for (const [a, b, v] of PACE) {
    const k = clamp((x - (a - 0.4)) / 0.4) * clamp(((b + 0.4) - x) / 0.4);
    r = Math.min(r, lerp(1, v, E.sine(k)));

  return r;
}
// ---------- Music sync ----------
// The film is locked to apps/promo/audio/hashmusic.mp3, played from its 0:10 mark (a quiet spot in
// the intro). Film t plays track t + MUSIC.start. Sync points, as [story time, track time]:
// the orbit unfolds on the drop (0:17.5) and the end screen lands as the track falls into its outro
// (1:21). Between sync points the reading pace above is deepened or eased (one factor per stretch)
// so each point lands exactly; moves keep their speed as far as possible.
const MUSIC = { file: "audio/hashmusic.mp3", start: 10.0, fadeIn: 1.2, fadeOut: 3.5 };
const SYNC = [[0, MUSIC.start], [T.unfold, 17.5], [T.collapse[1] - 0.3, 81.0]];
const FILM_END = 80.0; // the end card holds after the story ends; picture and music fade out
const FPS_WARP = 600;
const WARP = [0];
{
  const dt = 1 / FPS_WARP;
  const rate = (x, k) => Math.max(0.2, 1 - k * (1 - rateAt(x)));
  const filmLen = (s0, s1, k) => { let x = s0, n = 0; while (x < s1) { x += rate(x, k) * dt; n++; } return n * dt; };
  for (let i = 1; i < SYNC.length; i++) {
    const [s0, a0] = SYNC[i - 1], [s1, a1] = SYNC[i], want = a1 - a0;
    let lo = 0, hi = 4;
    for (let it = 0; it < 40; it++) { const k = (lo + hi) / 2; if (filmLen(s0, s1, k) < want) lo = k; else hi = k; }
    const k = (lo + hi) / 2, n = Math.round(want / dt), out = [];
    let x = s0;
    for (let j = 0; j < n; j++) { x += rate(x, k) * dt; out.push(x); }
    // land exactly on the sync point (the fit is already within a frame; this removes the rest)
    const fix = (s1 - s0) / (out[n - 1] - s0);
    for (const v of out) WARP.push(s0 + (v - s0) * fix);
  }
  let x = WARP[WARP.length - 1];
  while (WARP.length - 1 < FILM_END * FPS_WARP) { x = Math.min(STORY, x + rateAt(x) * dt); WARP.push(x); }
}
const DURATION = FILM_END;
const black = document.createElement("div");
black.style.cssText = "position:absolute;inset:0;background:#000;pointer-events:none;opacity:0";
$("stage").appendChild(black);
function seek(t) {
  const i = clamp(t * FPS_WARP, 0, WARP.length - 1), i0 = Math.floor(i), i1 = Math.min(WARP.length - 1, i0 + 1);
  seekStory(lerp(WARP[i0], WARP[i1], i - i0));
  black.style.opacity = E.io(clamp((t - (FILM_END - 1.4)) / 1.4)).toFixed(3);
}
window.MUSIC = MUSIC;
window.storyAt = (t) => WARP[Math.round(clamp(t * FPS_WARP, 0, WARP.length - 1))];
window.seek = seek;
window.DURATION = DURATION;

if (!navigator.webdriver) {
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = `scale(${k})`; };
  fit(); addEventListener("resize", fit);
  document.fonts.load("700 100px Inter").then(() => {
    const fixed = new URLSearchParams(location.search).get("t");
    if (fixed !== null) seek(Number(fixed));
    else { const t0 = performance.now(); const loop = (n) => { seek(((n - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  });
}
